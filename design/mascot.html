<meta charset="utf-8">
<title>구름 마스코트 시안</title>
<style>
/* ── 폰트 (Google Fonts 만 허용) ───────────────────────────────── */
@import url('https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Noto+Sans+KR:wght@400;500;700&family=JetBrains+Mono:wght@400;600&display=swap');

/* ── 적진 토큰 (D-204) ────────────────────────────────────────── */
:root{
  --page:#060505;
  --card:#120c0c;
  --card2:#1a1010;
  --line:#2a1616;
  --line-soft:#1a1010;
  --text:#d6c9c9;
  --strong:#f6eded;
  --meta:#9a8080;
  --faint:#6b5555;
  --accent:#d92b2b;
  --font-display:'Black Han Sans',sans-serif;
  --font-body:'Noto Sans KR',sans-serif;
  --font-num:'JetBrains Mono',monospace;
  --layout-max:1120px;
}

*{box-sizing:border-box}
body{
  margin:0;background:var(--page);color:var(--text);
  font-family:var(--font-body);font-size:15px;line-height:1.6;
  -webkit-font-smoothing:antialiased;
}
.wrap{max-width:var(--layout-max);margin:0 auto;padding:28px 16px 80px}

/* ── 맨 위 안내 한 줄 ─────────────────────────────────────────── */
.callout{
  border:1px solid var(--accent);border-radius:2px;
  padding:12px 14px;margin-bottom:26px;
  color:var(--strong);font-size:14px;
}
.callout b{color:var(--accent);font-weight:700}

h1{
  font-family:var(--font-display);font-weight:400;
  font-size:clamp(26px,6vw,40px);letter-spacing:.01em;
  color:var(--strong);margin:0 0 6px;line-height:1.15;
}
.sub{color:var(--meta);font-size:13.5px;margin:0 0 22px}

/* ── 조건 요약 줄 ─────────────────────────────────────────────── */
.rules{
  display:flex;flex-wrap:wrap;gap:8px;margin:0 0 34px;padding:0;list-style:none;
}
.rules li{
  border:1px solid var(--line);border-radius:2px;
  padding:5px 10px;font-size:12.5px;color:var(--meta);
}
.rules li b{color:var(--text);font-weight:500}

/* ── 카드 격자 ────────────────────────────────────────────────── */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:22px}
.card{
  background:var(--card);border:1px solid var(--line);border-radius:2px;
  padding:18px 16px 16px;
}
.card-head{display:flex;align-items:baseline;gap:9px;margin-bottom:2px}
.no{
  font-family:var(--font-num);font-size:13px;font-weight:600;
  color:var(--accent);letter-spacing:.02em;
}
.nm{font-family:var(--font-display);font-weight:400;font-size:21px;color:var(--strong);letter-spacing:.01em}
.desc{color:var(--meta);font-size:12.5px;margin:0 0 14px;min-height:2.6em}

/* 큰 그림 */
.hero{
  display:flex;align-items:center;justify-content:center;
  background:var(--card2);border-radius:2px;
  padding:10px 0;margin-bottom:14px;
}
.hero svg{width:184px;height:184px;display:block}

/* 표정 네 칸 */
.faces{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-bottom:14px}
.face{text-align:center}
.face svg{width:100%;height:auto;max-width:78px;display:block;margin:0 auto}
.face span{display:block;font-size:11px;color:var(--faint);margin-top:2px;letter-spacing:.02em}

/* 로고 안에 들어간 모습 */
.logo-box{
  background:var(--card2);border-radius:2px;padding:14px 8px;margin-bottom:12px;
  display:flex;align-items:center;justify-content:center;
}
.logo{display:flex;align-items:center;gap:6px}
.logo .word{
  font-family:var(--font-display);font-weight:400;
  font-size:30px;line-height:1;color:var(--strong);letter-spacing:.02em;
}
.logo svg{width:42px;height:42px;display:block;flex:none}

/* 작게 줄였을 때 (실제 판정) */
.tiny{
  display:flex;align-items:flex-end;justify-content:center;gap:16px;
  border-top:1px solid var(--line-soft);padding-top:12px;
}
.tiny div{text-align:center}
.tiny svg{display:block;margin:0 auto}
.tiny b{
  display:block;font-family:var(--font-num);font-size:10px;
  color:var(--faint);font-weight:400;margin-top:4px;
}

/* ── 아주 느리고 미세한 움직임 ─────────────────────────────────── */
@keyframes floaty{
  0%,100%{transform:translateY(0)}
  50%{transform:translateY(-2.5px)}
}
@keyframes breathe{
  0%,100%{transform:scale(1)}
  50%{transform:scale(1.012)}
}
.float{animation:floaty 7s ease-in-out infinite;will-change:transform}
.float.b{animation:floaty 8.5s ease-in-out infinite,breathe 6s ease-in-out infinite}
@media (prefers-reduced-motion:reduce){
  .float,.float.b{animation:none}
}

@media (max-width:430px){
  .grid{grid-template-columns:1fr}
  .hero svg{width:160px;height:160px}
  .logo .word{font-size:25px}
  .logo svg{width:35px;height:35px}
}

<div class="wrap">

  <h1>구름 마스코트 시안</h1>
  <p class="sub">3RD 와 CLOUD 사이에 들어갈 아이. 발이 없고, 아랫단이 흐려지거나 물결지며 사라진다.</p>

  <ul class="rules">

    <li><b>두리번</b> 파일을 뒤지는 중</li>
    <li><b>반짝</b> 찾았을 때</li>
    <li><b>뿌듯</b> 랭킹에 꽂고 난 뒤</li>

<script>
/* ══════════════════════════════════════════════════════════════
   구름 마스코트 생성기
   - 몸통(topPath) + 아랫단(bottom) + 눈(eye) + 덤(extras) 을 조합한다
   - 이미지 파일 없이 전부 인라인 SVG 로 그린다
   ══════════════════════════════════════════════════════════════ */

let UID = 0;

/* ── 시안 정의 ─────────────────────────────────────────────────
   path : (xL,yB) 에서 시작해 머리 위를 돌아 (xR,yB) 에서 끝난다
   bottom : wave(물결) / spike(뾰족뾰족) / fade(스르르 사라짐) / drip(물방울)
   eye : big(큰 원+하이라이트) / dot(점) / tall(세로로 긴) / moon(반달)
         / tilt(살짝 삐뚤) / ring(윤곽선 눈)
   ─────────────────────────────────────────────────────────── */
const DESIGNS = [
  {
    no:'01', name:'몽글', desc:'통통한 뭉게구름. 아랫단이 물결지고 눈이 제일 크다. 볼 홍조.',
    path:'M18,66 C7,66 5,52 16,49 C10,35 26,25 36,31 C42,17 64,17 70,32 C84,31 88,48 79,51 C88,57 85,66 78,66',
    xL:18, xR:78, yB:66, bottom:'wave',
    eye:'big', eyes:{x1:41,x2:59,y:46}, outline:false, extras:['blush']
  },
  {
    no:'02', name:'삐죽', desc:'각지게 접힌 구름. 아랫단이 뾰족뾰족하고 머리 위에 작은 번개. 윤곽선 있음.',
    path:'M20,64 L14,54 L18,44 L28,39 L30,29 L44,25 L56,28 L64,22 L76,31 L80,43 L86,50 L80,64',
    xL:20, xR:80, yB:64, bottom:'spike',
    eye:'dot', eyes:{x1:41,x2:59,y:46}, outline:true, extras:['bolt']
  },
  {
    no:'03', name:'스르르', desc:'길쭉하게 선 구름. 아래가 그라데이션으로 녹아 사라진다. 세로로 긴 눈, 덤 없음.',
    path:'M28,78 C18,74 16,58 24,53 C16,43 22,29 34,29 C36,13 58,10 63,25 C77,25 83,41 75,49 C83,55 81,74 72,78',
    xL:28, xR:72, yB:78, bottom:'fade',
    eye:'tall', eyes:{x1:42,x2:58,y:44}, outline:false, extras:[]
  },
  {
    no:'04', name:'또옥', desc:'물방울에 가까운 몸. 아래로 방울이 하나씩 떨어진다. 반달 눈 + 짧은 팔.',
    path:'M24,66 C13,61 16,43 28,37 C30,21 44,13 50,13 C56,13 70,21 72,37 C84,43 87,61 76,66',
    xL:24, xR:76, yB:66, bottom:'drip',
    eye:'moon', eyes:{x1:42,x2:58,y:43}, outline:false, extras:['arms']
  },
  {
    no:'05', name:'납작이', desc:'옆으로 퍼진 납작한 구름. 물결 하단. 눈이 점이고 하나가 살짝 삐뚤다. 볼 홍조.',
    path:'M12,60 C3,58 3,46 13,44 C11,34 25,28 35,34 C41,24 61,24 67,34 C79,28 93,36 89,46 C97,48 97,60 88,60',
    xL:12, xR:88, yB:60, bottom:'wave',
    eye:'tilt', eyes:{x1:41,x2:59,y:44}, outline:false, extras:['blush']
  },
  {
    no:'06', name:'알사탕', desc:'동그란 한 덩이. 아래가 스르르 사라지고 머리 위에 작은 별. 큰 눈 + 하이라이트.',
    path:'M24,76 C11,66 13,40 27,31 C37,21 63,21 73,31 C87,40 89,66 76,76',
    xL:24, xR:76, yB:76, bottom:'fade',
    eye:'big', eyes:{x1:41,x2:59,y:46}, outline:false, extras:['star']
  },
  {
    no:'07', name:'세뭉치', desc:'봉긋한 봉우리 셋. 물결 하단. 기본 표정부터 반달 눈이라 늘 웃고 있다. 윤곽선 있음.',
    path:'M16,66 C7,63 7,51 16,49 C11,39 22,30 30,37 C32,25 44,21 50,29 C56,19 70,23 70,35 C81,33 89,43 82,51 C89,55 88,66 80,66',
    xL:16, xR:80, yB:66, bottom:'wave',
    eye:'moon', eyes:{x1:41,x2:59,y:49}, outline:true, extras:[]
  },
  {
    no:'08', name:'식빵', desc:'네모나게 둥근 몸. 아랫단이 뾰족뾰족. 세로로 긴 눈 + 짧은 팔 + 볼 홍조.',
    path:'M18,64 C10,64 10,32 18,30 C20,18 40,16 46,24 C56,16 76,20 78,32 C86,36 86,64 80,64',
    xL:18, xR:80, yB:64, bottom:'spike',
    eye:'tall', eyes:{x1:41,x2:58,y:46}, outline:false, extras:['arms','blush']
  },
  {
    no:'09', name:'기웃', desc:'한쪽으로 흐른 비대칭 몸. 방울이 떨어진다. 눈이 하나만 크고 살짝 삐뚤다. 윤곽선 있음.',
    path:'M14,64 C3,59 5,43 17,41 C17,24 38,18 46,29 C58,20 77,29 74,42 C86,45 88,60 78,64',
    xL:14, xR:78, yB:64, bottom:'drip',
    eye:'tilt', eyes:{x1:39,x2:57,y:45}, outline:true, extras:[]
  },
  {
    no:'10', name:'하양', desc:'가장 단순한 작은 뭉치. 아래가 스르르 사라지고 눈은 점 둘. 덤이 하나도 없다.',
    path:'M26,74 C13,70 13,50 23,45 C21,31 37,23 45,31 C53,21 71,25 71,39 C83,44 85,70 74,74',
    xL:26, xR:74, yB:74, bottom:'fade',
    eye:'dot', eyes:{x1:40,x2:58,y:48}, outline:false, extras:[]
  }
];

const EXPR = [
  ['calm','가만히'],
  ['look','두리번'],
  ['spark','반짝'],
  ['proud','뿌듯']
];

/* ── 아랫단 그리기: (xR,yB) → (xL,yB) 로 되돌아오는 path 조각 ── */
function bottomPath(d){
  const w = (d.xR - d.xL) / 4;
  let s = '';
  if(d.bottom === 'wave'){
    for(let i=0;i<4;i++) s += ` q ${(-w/2).toFixed(2)},${i%2===0?7:-5} ${(-w).toFixed(2)},0`;
  } else if(d.bottom === 'spike'){
    for(let i=0;i<4;i++) s += ` l ${(-w/2).toFixed(2)},7.5 l ${(-w/2).toFixed(2)},-7.5`;
  } else if(d.bottom === 'drip'){
    for(let i=0;i<4;i++) s += ` q ${(-w/2).toFixed(2)},${i%2===0?5:-3} ${(-w).toFixed(2)},0`;
  } else { /* fade — 직선. 마스크가 아래를 지운다 */
    s += ` L ${d.xL},${d.yB}`;
  }
  return s + ' Z';
}

/* ── 몸통 ─────────────────────────────────────────────────────── */
function bodySvg(d, uid){
  const useMask = d.bottom === 'fade';
  const defs = `
    <linearGradient id="g${uid}" x1="0" y1="0" x2="0.2" y2="1">
      <stop offset="0" stop-color="#f6eded" stop-opacity="0.40"/>
      <stop offset="0.55" stop-color="#dff2f4" stop-opacity="0.25"/>
      <stop offset="1" stop-color="#c9e6ea" stop-opacity="0.14"/>
    </linearGradient>
    <radialGradient id="h${uid}" cx="0.5" cy="0.45" r="0.55">
      <stop offset="0" stop-color="#dff2f4" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#dff2f4" stop-opacity="0"/>
    </radialGradient>
    ${useMask ? `
    <linearGradient id="fg${uid}" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0.30" stop-color="#fff"/>
      <stop offset="0.58" stop-color="#fff" stop-opacity="0.78"/>
      <stop offset="0.80" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <mask id="fm${uid}"><rect x="0" y="0" width="100" height="100" fill="url(#fg${uid})"/></mask>` : ''}
  `;
  const stroke = d.outline
    ? ' stroke="#f6eded" stroke-opacity="0.42" stroke-width="1.6" stroke-linejoin="round"'
    : '';
  const dAttr = d.path + bottomPath(d);
  const body = `<path d="${dAttr}" fill="url(#g${uid})"${stroke}${useMask?` mask="url(#fm${uid})"`:''}/>`;

  /* 떨어지는 물방울 (drip 전용) */
  let drops = '';
  if(d.bottom === 'drip'){
    const cx = (d.xL + d.xR)/2;
    drops = `
      <ellipse cx="${cx-13}" cy="${d.yB+7}" rx="1.9" ry="2.5" fill="#dff2f4" fill-opacity="0.22"/>
      <ellipse cx="${cx+3}" cy="${d.yB+11}" rx="1.5" ry="2.1" fill="#dff2f4" fill-opacity="0.15"/>
      <ellipse cx="${cx+15}" cy="${d.yB+5}" rx="1.2" ry="1.7" fill="#dff2f4" fill-opacity="0.11"/>`;
  }
  return `<defs>${defs}</defs>
    <ellipse cx="50" cy="46" rx="42" ry="34" fill="url(#h${uid})"/>
    ${body}${drops}`;
}

/* ── 눈 한 짝 ─────────────────────────────────────────────────── */
function eye(style, x, y, s, dx, squash){
  s = s || 1; dx = dx || 0; squash = squash || 1;
  const X = x + dx;
  const F = '#f6eded';
  switch(style){
    case 'big':
      return `<ellipse cx="${X}" cy="${y}" rx="${(5.2*s).toFixed(2)}" ry="${(5.2*s*squash).toFixed(2)}" fill="${F}"/>
              <circle cx="${(X-1.7).toFixed(2)}" cy="${(y-1.9).toFixed(2)}" r="${(1.75*s).toFixed(2)}" fill="#ffffff"/>
              <circle cx="${(X+1.9).toFixed(2)}" cy="${(y+2.0).toFixed(2)}" r="${(0.8*s).toFixed(2)}" fill="#ffffff" fill-opacity="0.75"/>`;
    case 'dot':
      return `<circle cx="${X}" cy="${y}" r="${(3.1*s).toFixed(2)}" fill="${F}"/>`;
    case 'tall':
      return `<ellipse cx="${X}" cy="${y}" rx="${(2.7*s).toFixed(2)}" ry="${(4.8*s*squash).toFixed(2)}" fill="${F}"/>
              <circle cx="${(X-0.8).toFixed(2)}" cy="${(y-2.2).toFixed(2)}" r="${(0.85*s).toFixed(2)}" fill="#ffffff"/>`;
    case 'moon':
      return `<path d="M${(X-4.6*s).toFixed(2)},${(y+1.6).toFixed(2)} q ${(4.6*s).toFixed(2)},${(-6.4*s).toFixed(2)} ${(9.2*s).toFixed(2)},0"
                fill="none" stroke="${F}" stroke-width="${(2.2*s).toFixed(2)}" stroke-linecap="round"/>`;
    case 'ring':
      return `<circle cx="${X}" cy="${y}" r="${(4.4*s).toFixed(2)}" fill="none" stroke="${F}" stroke-width="1.8"/>
              <circle cx="${X}" cy="${y}" r="${(1.7*s).toFixed(2)}" fill="${F}"/>`;
    case 'tilt':
    default:
      /* 살짝 삐뚤 — 크기와 높이가 미묘하게 다르다 */
      return `<circle cx="${X}" cy="${y}" r="${(3.5*s).toFixed(2)}" fill="${F}"/>
              <circle cx="${(X-1.0).toFixed(2)}" cy="${(y-1.2).toFixed(2)}" r="${(1.1*s).toFixed(2)}" fill="#ffffff"/>`;
  }
}

/* ── 표정 ─────────────────────────────────────────────────────── */
function faceSvg(d, expr){
  const {x1,x2,y} = d.eyes;
  const mid = (x1+x2)/2;
  const F = '#f6eded';
  let out = '';

  /* 삐뚤 눈은 오른쪽 눈이 조금 높고 조금 작다 — 대칭을 일부러 깬다 */
  const tilt = d.eye === 'tilt';
  const dy2 = tilt ? -1.7 : 0;
  const s2  = tilt ? 0.84 : 1;

  if(expr === 'calm'){
    out += eye(d.eye, x1, y, 1);
    out += eye(d.eye, x2, y + dy2, s2);
    out += `<path d="M${mid-2.6},${y+8} q 2.6,2.4 5.2,0" fill="none" stroke="${F}" stroke-opacity="0.75" stroke-width="1.5" stroke-linecap="round"/>`;
  }

  else if(expr === 'look'){
    /* 눈이 옆으로 쏠리고 살짝 눌린다 + 물음표 */
    out += eye(d.eye, x1, y, 0.95, 2.2, 0.82);
    out += eye(d.eye, x2, y + dy2, 0.95*s2, 2.4, 0.82);
    out += `<path d="M${mid-2.2},${y+8.2} q 2.2,-1.6 4.4,0" fill="none" stroke="${F}" stroke-opacity="0.6" stroke-width="1.4" stroke-linecap="round"/>`;
    out += `<text x="${x2+11}" y="${y-6}" font-family="'Noto Sans KR',sans-serif" font-size="13" font-weight="700"
              fill="#9a8080" text-anchor="middle">?</text>`;
  }

  else if(expr === 'spark'){
    /* 눈이 커지고 반짝임 — 진홍은 여기서만 아주 조금 */
    out += eye(d.eye === 'moon' ? 'big' : d.eye, x1, y-0.6, 1.28);
    out += eye(d.eye === 'moon' ? 'big' : d.eye, x2, y-0.6+dy2, 1.28*s2);
    out += `<path d="M${mid-3},${y+8.6} q 3,4 6,0" fill="none" stroke="${F}" stroke-opacity="0.8" stroke-width="1.6" stroke-linecap="round"/>`;
    out += star(x2+11, y-9, 3.4, '#d92b2b', 0.95);
    out += star(x1-11, y-4, 2.2, '#f6eded', 0.7);
    out += star(x2+6, y+9, 1.6, '#f6eded', 0.5);
  }

  else { /* proud — 반달 눈 ^ ^ + 홍조 */
    out += `<path d="M${x1-4.8},${y+1.8} q 4.8,-6.6 9.6,0" fill="none" stroke="${F}" stroke-width="2.3" stroke-linecap="round"/>`;
    out += `<path d="M${x2-4.8},${y+1.8} q 4.8,-6.6 9.6,0" fill="none" stroke="${F}" stroke-width="2.3" stroke-linecap="round"/>`;
    out += `<path d="M${mid-3.2},${y+8} q 3.2,3.4 6.4,0" fill="none" stroke="${F}" stroke-opacity="0.85" stroke-width="1.6" stroke-linecap="round"/>`;
    out += blush(x1, x2, y);
  }

  /* 시안 자체가 볼 홍조를 가진 경우 (뿌듯에는 이미 있다) */
  if(d.extras.includes('blush') && expr !== 'proud') out += blush(x1, x2, y);

  return out;
}

function blush(x1,x2,y){
  return `<ellipse cx="${x1-6.4}" cy="${y+4.6}" rx="3.6" ry="2.1" fill="#d92b2b" fill-opacity="0.28"/>
          <ellipse cx="${x2+6.4}" cy="${y+4.6}" rx="3.6" ry="2.1" fill="#d92b2b" fill-opacity="0.28"/>`;
}

function star(cx,cy,r,color,op){
  const k = r*0.30;
  return `<path d="M${cx},${cy-r} Q${cx+k},${cy-k} ${cx+r},${cy} Q${cx+k},${cy+k} ${cx},${cy+r} Q${cx-k},${cy+k} ${cx-r},${cy} Q${cx-k},${cy-k} ${cx},${cy-r} Z"
            fill="${color}" fill-opacity="${op}"/>`;
}

/* ── 덤 (팔 · 별 · 번개) ──────────────────────────────────────── */
function extrasSvg(d){
  let out = '';
  const {x1,x2,y} = d.eyes;
  if(d.extras.includes('arms')){
    out += `<path d="M${x1-13},${y+7} q -5,1 -7,5" fill="none" stroke="#f6eded" stroke-opacity="0.45" stroke-width="2.2" stroke-linecap="round"/>
            <path d="M${x2+13},${y+7} q 5,1 7,5" fill="none" stroke="#f6eded" stroke-opacity="0.45" stroke-width="2.2" stroke-linecap="round"/>`;
  }
  if(d.extras.includes('star')){
    out += star(66, 16, 3.6, '#d92b2b', 0.85) + star(74, 24, 1.9, '#f6eded', 0.55);
  }
  if(d.extras.includes('bolt')){
    out += `<path d="M80,4 L72,14 L77,14 L73,23 L84,11 L79,11 Z" fill="#d92b2b" fill-opacity="0.9"/>`;
  }
  return out;
}

/* ── 마스코트 한 장 ───────────────────────────────────────────── */
function mascot(d, expr, cls){
  const uid = ++UID;
  return `<svg viewBox="0 0 100 100" class="${cls||''}" role="img" aria-label="${d.name} ${expr}">
    ${bodySvg(d, uid)}
    ${extrasSvg(d)}
    ${faceSvg(d, expr)}
  </svg>`;
}

/* ── 카드 ─────────────────────────────────────────────────────── */
function card(d){
  const faces = EXPR.map(([k,label]) =>
    `<div class="face">${mascot(d,k)}<span>${label}</span></div>`
  ).join('');

  return `<div class="card">
    <div class="card-head"><span class="no">${d.no}</span><span class="nm">${d.name}</span></div>
    <p class="desc">${d.desc}</p>

    <div class="hero">${mascot(d,'calm','float b')}</div>

    <div class="faces">${faces}</div>

    <div class="logo-box">
      <div class="logo">
        <span class="word">3RD</span>
        ${mascot(d,'calm','float')}
        <span class="word">CLOUD</span>
      </div>
    </div>

    <div class="tiny">
      <div><svg-slot data-s="40"></svg-slot><b>40px</b></div>
      <div><svg-slot data-s="28"></svg-slot><b>28px</b></div>
      <div><svg-slot data-s="20"></svg-slot><b>20px</b></div>
    </div>
  </div>`;
}

/* 렌더 */
const grid = document.getElementById('grid');
grid.innerHTML = DESIGNS.map(card).join('');

/* 작은 크기 칸 채우기 — 크기를 인라인으로 박는다 */
DESIGNS.forEach((d, i) => {
  const cardEl = grid.children[i];
  cardEl.querySelectorAll('svg-slot').forEach(slot => {
    const s = slot.dataset.s;
    const tmp = document.createElement('div');
    tmp.innerHTML = mascot(d,'calm');
    const svg = tmp.firstElementChild;
    svg.setAttribute('width', s);
    svg.setAttribute('height', s);
    slot.replaceWith(svg);
  });
});
</script>
