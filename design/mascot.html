/* ── 적진 토큰 (D-204) ────────────────────────────────────────── */
:root{
  --page:#060505;
  --card:#120c0c;
  --card2:#1a1010;

  --line-soft:#1a1010;

*{box-sizing:border-box}
body{
  margin:0;background:var(--page);color:var(--text);
  font-family:var(--font-body);font-size:15px;line-height:1.6;
  -webkit-font-smoothing:antialiased;

.wrap{max-width:var(--layout-max);margin:0 auto;padding:28px 16px 80px}

.rules{
  display:flex;flex-wrap:wrap;gap:8px;margin:0 0 34px;padding:0;list-style:none;
}
.rules li{
  border:1px solid var(--line);border-radius:2px;
  padding:5px 10px;font-size:12.5px;color:var(--meta);
}
.rules li b{color:var(--text);font-weight:500}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:22px}
.card{

  padding:18px 16px 16px;

.desc{color:var(--meta);font-size:12.5px;margin:0 0 14px;min-height:2.6em}

/* 투명한지 알려면 **뒤에 뭔가 비쳐야 한다.** 옅은 격자를 깔아 둔다 */
.holo-bg{
  background-color:var(--card2);

}

/* 큰 그림 — 왼쪽 가만히 / 오른쪽 안기(대표 그림) */
.hero{
  display:grid;grid-template-columns:1fr 1fr;gap:8px;
  border-radius:2px;
  padding:10px 8px 8px;margin-bottom:14px;
}
.hero > div{text-align:center;min-width:0}
.hero svg{width:100%;height:auto;max-width:170px;display:block;margin:0 auto}
.hero b{

  margin-top:3px;letter-spacing:.02em;
}
.hero b.k{color:var(--accent);font-weight:700}

/* 표정 네 칸 */

.face{text-align:center;border-radius:2px;padding:4px 2px 3px}
.face svg{width:100%;height:auto;display:block;margin:0 auto}
.face span{display:block;font-size:11px;color:var(--faint);margin-top:2px;letter-spacing:.02em}

.face.key span{color:var(--strong);font-weight:700;font-size:11.5px}

/* 로고 안에 들어간 모습 */

.logo{display:flex;align-items:center;gap:6px}
.logo .word{
  font-family:var(--font-display);font-weight:400;

}
.logo svg{width:42px;height:42px;display:block;flex:none}

/* 작게 줄였을 때 (실제 판정) */

  display:flex;align-items:flex-end;justify-content:center;gap:16px;

.tiny div{text-align:center}
.tiny svg{display:block;margin:0 auto}
.tiny b{

/* ── 아주 느리고 미세한 움직임 ─────────────────────────────────── */
@keyframes floaty{
  0%,100%{transform:translateY(0)}
  50%{transform:translateY(-2.5px)}
}
@keyframes breathe{
  0%,100%{transform:scale(1)}
  50%{transform:scale(1.012)}
}
.float{animation:floaty 7s ease-in-out infinite;will-change:transform}
.float.b{animation:floaty 8.5s ease-in-out infinite,breathe 6s ease-in-out infinite}
@media (prefers-reduced-motion:reduce){
  .float,.float.b{animation:none}
}

@media (max-width:430px){
  .grid{grid-template-columns:1fr}

<script>
/* ══════════════════════════════════════════════════════════════
   구름 마스코트 생성기
   - 몸통(topPath) + 아랫단(bottom) + 눈(eye) + 덤(extras) 을 조합한다
   - 이미지 파일 없이 전부 인라인 SVG 로 그린다
   ══════════════════════════════════════════════════════════════ */

let UID = 0;

/* 몸이 새하얘졌으므로 눈·입은 어두운 색이다. 흰 몸 + 흰 눈은 안 보인다 */
/* ── 재질 — design/pile.html 8번 시안에서 그대로 가져왔다 ──────────
   :root{ --hi rgba(255,255,255,.95) · --edge rgba(230,253,255,.68)
          --f1 rgba(235,255,255,.34) · --f2 rgba(205,244,248,.185)
          --f3 rgba(160,212,222,.055) }
   값을 새로 정하지 않는다. 파일과 구름이가 **같은 물질**이어야 한다 */
const MAT = {
  /* 구름 몸통 — pile.html 의 `svg.cloud > linearGradient#cg1` 을 그대로 옮겼다.
     한 겹으로도 하얗게 읽히면서 아래로 갈수록 사라진다 */
  c1:   {c:'#ffffff', o:0.95, at:0.04},
  c2:   {c:'#eafdff', o:0.52, at:0.58},
  c3:   {c:'#bfe9f2', o:0.08, at:1},
  cEdge:{c:'#ffffff', o:0.82, w:1.5},   /* pile 의 stroke 값 그대로 */

  hi:   {c:'#ffffff', o:0.95},   /* 윗변 — 가장 밝은 선 */
  edge: {c:'#e6fdff', o:0.68},   /* 테두리 */
  f1:   {c:'#ebffff', o:0.34},   /* 면 위쪽 */
  f2:   {c:'#cdf4f8', o:0.185},  /* 면 가운데 */
  f3:   {c:'#a0d4de', o:0.055},  /* 면 아랫단 — 거의 사라진다 */
  inset:{c:'#ffffff', o:0.55},   /* 윗변 안쪽 하이라이트 */
  rule: {c:'#ffffff', o:0.30},   /* 라벨 띠 한 줄 */
};

/* 몸이 이 재질이면 «검은 눈»은 절대 안 보인다 (면 알파가 0.055~0.34).
   그래서 눈을 만화식으로 만든다 — **밝은 흰자 + 어두운 눈동자**.
   눈동자는 여전히 어둡고, 흰자가 그것을 받쳐 준다.
   옛 방식(몸이 불투명할 때 쓰던 어두운 눈 하나)은 EYE 로 남겨 둔다 */
const EYE = '#120a0d';          /* 눈동자 — 옛 «어두운 눈» 값 그대로 */
const SCLERA_O = 0.93;          /* 흰자 = --hi 와 같은 밝기대 */

/* ── 시안 정의 ─────────────────────────────────────────────────
   path : (xL,yB) 에서 시작해 머리 위를 돌아 (xR,yB) 에서 끝난다
   bottom : wave(물결) / spike(뾰족뾰족) / fade(스르르 사라짐) / drip(물방울)
   eye : big(큰 원+하이라이트) / dot(점) / tall(세로로 긴) / moon(반달)
         / tilt(살짝 삐뚤) / ring(윤곽선 눈)
   ─────────────────────────────────────────────────────────── */
const DESIGNS = [
  {
    no:'01', name:'몽글', desc:'통통한 뭉게구름. 아랫단이 물결지고 눈이 제일 크다. 볼 홍조.',

    path:'M20,64 L14,54 L18,44 L28,39 L30,29 L44,25 L56,28 L64,22 L76,31 L80,43 L86,50 L80,64',
    xL:20, xR:80, yB:64, bottom:'spike',

    path:'M28,78 C18,74 16,58 24,53 C16,43 22,29 34,29 C36,13 58,10 63,25 C77,25 83,41 75,49 C83,55 81,74 72,78',

    path:'M24,66 C13,61 16,43 28,37 C30,21 44,13 50,13 C56,13 70,21 72,37 C84,43 87,61 76,66',
    xL:24, xR:76, yB:66, bottom:'drip',

  },

  },
  {

    xL:24, xR:76, yB:76, bottom:'fade',

    eye:'big', eyes:{x1:41,x2:59,y:46}, outline:false, extras:['star']
  },
  {
    no:'07', name:'세뭉치', desc:'봉긋한 봉우리 셋. 물결 하단. 기본 표정부터 반달 눈이라 늘 웃고 있다. 테두리광이 굵다.',

    xL:16, xR:80, yB:66, bottom:'wave',
    arm:{lx:10,ly:56,rx:86,ry:56},
    eye:'moon', eyes:{x1:41,x2:59,y:49}, outline:true, extras:[]
  },
  {
    no:'08', name:'식빵', desc:'네모나게 둥근 몸. 아랫단이 뾰족뾰족. 세로로 긴 눈 + 볼 홍조.',
    path:'M18,64 C10,64 10,32 18,30 C20,18 40,16 46,24 C56,16 76,20 78,32 C86,36 86,64 80,64',
    xL:18, xR:80, yB:64, bottom:'spike',
    arm:{lx:12,ly:53,rx:84,ry:53},

    path:'M14,64 C3,59 5,43 17,41 C17,24 38,18 46,29 C58,20 77,29 74,42 C86,45 88,60 78,64',
    xL:14, xR:78, yB:64, bottom:'drip',

  {

    path:'M26,74 C13,70 13,50 23,45 C21,31 37,23 45,31 C53,21 71,25 71,39 C83,44 85,70 74,74',
    xL:26, xR:74, yB:74, bottom:'fade',

/* 사용자가 「두리번」과 「뿌듯」을 골랐다. 그 둘을 앞에 크게 둔다.
   「안기」는 대표 그림이므로 위쪽 큰 칸에 따로 세운다 */
const EXPR = [
  ['look','두리번',  true],
  ['proud','뿌듯',   true],
  ['spark','반짝',   false]
];

/* ── 아랫단 그리기: (xR,yB) → (xL,yB) 로 되돌아오는 path 조각 ── */
function bottomPath(d){
  const w = (d.xR - d.xL) / 4;
  let s = '';
  if(d.bottom === 'wave'){
    for(let i=0;i<4;i++) s += ` q ${(-w/2).toFixed(2)},${i%2===0?7:-5} ${(-w).toFixed(2)},0`;
  } else if(d.bottom === 'spike'){
    for(let i=0;i<4;i++) s += ` l ${(-w/2).toFixed(2)},7.5 l ${(-w/2).toFixed(2)},-7.5`;
  } else if(d.bottom === 'drip'){
    for(let i=0;i<4;i++) s += ` q ${(-w/2).toFixed(2)},${i%2===0?5:-3} ${(-w).toFixed(2)},0`;
  } else { /* fade — 직선. 마스크가 아래를 지운다 */
    s += ` L ${d.xL},${d.yB}`;
  }
  return s + ' Z';
}

/* ── 팔 ───────────────────────────────────────────────────────────
   짧고 통통한 뭉툭한 팔. 손가락은 없다.
   타원 하나가 곧 «통통한 팔» 이고, clipPath 에 그대로 넣을 수 있어
   몸통과 **같은 그라데이션**(userSpaceOnUse)을 공유한다 — 붙인 티가 안 난다.
   발은 없다. 아랫단은 그대로 흐려진다 */
function arm(x1,y1,x2,y2,w){
  const dx=x2-x1, dy=y2-y1, len=Math.hypot(dx,dy);
  return {cx:(x1+x2)/2, cy:(y1+y2)/2, rx:len/2 + w*0.42, ry:w/2,
          rot:Math.atan2(dy,dx)*180/Math.PI};
}

/* 표정마다 팔의 자세가 다르다 */
function armSet(d, expr){
  const a = d.arm, ey = d.eyes.y, mid = (d.eyes.x1 + d.eyes.x2)/2, W = 7.2;
  switch(expr){
    case 'look':   /* 한 팔을 들어 젖힌다 — 뒤지는 동작이 읽혀야 한다 */
      return [ arm(a.lx, a.ly, a.lx-9.5, a.ly-12.5, W),
               arm(a.rx, a.ry, a.rx+4.5, a.ry+8,    W) ];
    case 'spark':  /* 두 팔을 번쩍 */
      return [ arm(a.lx, a.ly, a.lx-7, a.ly-14, W),
               arm(a.rx, a.ry, a.rx+7, a.ry-14, W) ];
    case 'proud':  /* 허리에 얹은 느낌 — 짧게 안으로 접는다.
                      가슴 앞에서 교차시켜 봤더니 몸을 가로지르는 «띠»로 읽혀서 버렸다 */
      return [ arm(a.lx, a.ly, a.lx+7,  a.ly+9, W),
               arm(a.rx, a.ry, a.rx-7,  a.ry+9, W) ];
    case 'hug':    /* 두 팔로 파일을 감싸 안는다.
                      팔은 파일 «뒤»로 돌아가고 손만 앞에서 잡는다 —
                      앞으로 지나가면 팔이 파일을 덮어 버린다 */
      return [ arm(a.lx, a.ly, mid-16, ey+30, W+1.2),
               arm(a.rx, a.ry, mid+16, ey+30, W+1.2) ];
    default:       /* 가만히 — 몸에 붙이고 있다 */
      return [ arm(a.lx, a.ly, a.lx-5, a.ly+7.5, W),
               arm(a.rx, a.ry, a.rx+5, a.ry+7.5, W) ];
  }
}

/* 파일을 앞에서 잡는 손 — 손가락 없이 뭉툭한 덩어리 두 개 */
function handSet(d){
  const ey = d.eyes.y, mid = (d.eyes.x1 + d.eyes.x2)/2;
  return [ {cx:mid-17.5, cy:ey+29, rx:5.4, ry:4.6, rot:-14},

  }
  if(d.extras.includes('bolt')){
    out += `<path d="M80,4 L72,14 L77,14 L73,23 L84,11 L79,11 Z" fill="#d92b2b" fill-opacity="0.9"/>`;
  }
  return out;
}

/* ── 마스코트 한 장 ───────────────────────────────────────────── */
function mascot(d, expr, cls){
  const uid = ++UID;
  /* 두리번은 몸까지 갸웃한다 — 쏠린 눈이 훨씬 산다 */
  const tilt = (expr === 'look') ? ' transform="rotate(-6 50 62)"' : '';
  return `<svg viewBox="0 0 100 100" class="${cls||''}" role="img" aria-label="${d.name} ${expr}">
    <g${tilt}>
      ${bodySvg(d, uid, expr)}
      ${extrasSvg(d)}
      ${faceSvg(d, expr === 'hug' ? 'proud' : expr)}
    </g>
  </svg>`;
}

/* ── 카드 ─────────────────────────────────────────────────────── */
function card(d){
  const faces = EXPR.map(([k,label,key]) =>
    `<div class="face holo-bg${key?' key':''}">${mascot(d,k)}<span>${label}</span></div>`
  ).join('');

  return `<div class="card">
    <div class="card-head"><span class="no">${d.no}</span><span class="nm">${d.name}</span></div>
    <p class="desc">${d.desc}</p>

    <div class="hero holo-bg">
      <div>${mascot(d,'calm','float b')}<b>가만히</b></div>
      <div>${mascot(d,'hug','float b')}<b class="k">안기 — 찾은 파일을 안고 간다</b></div>
    </div>

    <div class="faces">${faces}</div>

    <div class="logo-box holo-bg">
      <div class="logo">
        <span class="word">3RD</span>
        ${mascot(d,'calm','float')}
        <span class="word">CLOUD</span>
      </div>
    </div>

    <div class="tiny holo-bg">
      <div><svg-slot data-s="40"></svg-slot><b>40px</b></div>
      <div><svg-slot data-s="28"></svg-slot><b>28px</b></div>
      <div><svg-slot data-s="20"></svg-slot><b>20px</b></div>
    </div>
  </div>`;
}

/* 렌더 */
const grid = document.getElementById('grid');
grid.innerHTML = DESIGNS.map(card).join('');

/* 작은 크기 칸 채우기 — 크기를 인라인으로 박는다 */
DESIGNS.forEach((d, i) => {
  const cardEl = grid.children[i];
  cardEl.querySelectorAll('svg-slot').forEach(slot => {
    const s = slot.dataset.s;
    const tmp = document.createElement('div');
    tmp.innerHTML = mascot(d,'calm');
    const svg = tmp.firstElementChild;
    svg.setAttribute('width', s);
    svg.setAttribute('height', s);
    slot.replaceWith(svg);
  });
});
</script>
