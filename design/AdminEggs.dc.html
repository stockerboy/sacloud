<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Noto+Sans+KR:wght@400;700&family=JetBrains+Mono:wght@400;500&display=swap">
  <style>
    body { margin: 0; -webkit-font-smoothing: antialiased; }
    .num { font-family: 'JetBrains Mono', ui-monospace, monospace; font-variant-numeric: tabular-nums; letter-spacing: -0.01em; }
    .display { font-family: 'Black Han Sans', 'Noto Sans KR', sans-serif; font-weight: 400; letter-spacing: -0.01em; }
    .body { font-family: 'Noto Sans KR', system-ui, sans-serif; }
    .tab { margin-bottom: -1px; padding: 10px 12px; }
    .sechead { padding-bottom: 8px; font-size: 13px; font-weight: 700; }
    .field { display: flex; align-items: center; height: 36px; border-radius: 2px; padding: 0 10px; font-size: 13px; }
    .eggrow { display: flex; align-items: center; gap: 12px; padding: 12px 0; }
    .eggname { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 14px; }
    .eggmeta { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin-top: 5px; font-size: 11px; }
    .badge { border-radius: 2px; padding: 2px 6px; }
    .btn { display: inline-flex; flex-shrink: 0; align-items: center; justify-content: center; height: 36px; padding: 0 16px; border-radius: 2px; font-size: 13px; }
    .stat { min-width: 76px; padding: 2px 0 2px 14px; }
  </style>
</helmet>

<div class="body" style="background: {{bg}}; min-height: 100%; padding: 0 12px 40px; font-size: 15px; color: {{text}}">

  <!-- ── 제목 ───────────────────────────────────────────── -->
  <div style="display: flex; align-items: baseline; gap: 10px; padding-top: 28px">
    <span class="display" style="font-size: 24px; color: {{textStrong}}">운영 관리</span>
    <span style="border: 1px solid {{line}}; border-radius: 2px; padding: 2px 7px; font-size: 11px; color: {{meta}}">관리자 전용</span>
  </div>

  <!-- ── 탭 ─────────────────────────────────────────────── -->
  <div style="display: flex; gap: 2px; border-bottom: 1px solid {{line}}; margin-top: 20px; font-size: 13px; overflow: hidden">
    <div class="tab" style="border-bottom: 1px solid transparent; color: {{meta}}">대시보드</div>
    <div class="tab" style="border-bottom: 1px solid transparent; color: {{meta}}">클랜</div>
    <div class="tab" style="border-bottom: 1px solid transparent; color: {{meta}}">시즌</div>
    <div class="tab" style="border-bottom: 1px solid transparent; color: {{meta}}">경기</div>
    <div class="tab" style="border-bottom: 1px solid {{accent}}; font-weight: 700; color: {{textStrong}}">알</div>
  </div>

  <!-- ── 알 상태 ────────────────────────────────────────── -->
  <div style="margin-top: 28px">
    <div class="sechead" style="border-bottom: 1px solid {{lineSoft}}; color: {{textStrong}}">알 상태</div>

    <div style="display: flex; gap: 20px; margin-top: 14px">
      <div class="stat" style="border-left: 1px solid {{lineSoft}}">
        <div style="font-size: 12px; color: {{meta}}">대상</div>
        <div class="num" style="margin-top: 3px; font-size: 22px; color: {{textStrong}}">62</div>
      </div>
      <div class="stat" style="border-left: 1px solid {{lineSoft}}">
        <div style="font-size: 12px; color: {{meta}}">깨짐</div>
        <div class="num" style="margin-top: 3px; font-size: 22px; color: {{accent}}">1</div>
      </div>
      <div class="stat" style="border-left: 1px solid {{lineSoft}}">
        <div style="font-size: 12px; color: {{meta}}">잠김</div>
        <div class="num" style="margin-top: 3px; font-size: 22px; color: {{textStrong}}">61</div>
      </div>
    </div>

    <div style="margin-top: 20px; border-left: 2px solid {{accent}}; padding: 3px 0 3px 14px; font-size: 11px; line-height: 1.75; color: {{meta}}">
      여기서 깨는 것은 <span style="color: {{text}}">시험용</span>입니다. 사유가
      <span style="color: {{accent}}">관리자 강제</span>로 남으므로, 나중에 칭호 인증이
      들어오면 이 기록만 골라 지우면 됩니다.
    </div>
  </div>

  <!-- ── 찾기 ───────────────────────────────────────────── -->
  <div style="margin-top: 30px">
    <div class="sechead" style="border-bottom: 1px solid {{lineSoft}}; color: {{textStrong}}">찾기</div>
    <div style="display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px">
      <div>
        <div style="font-size: 12px; color: {{meta}}">구분</div>
        <div class="field" style="width: 96px; border: 1px solid {{line}}; background: {{card2}}; color: {{text}}">클랜</div>
      </div>
      <div>
        <div style="font-size: 12px; color: {{meta}}">리그</div>
        <div class="field" style="width: 104px; border: 1px solid {{line}}; background: {{card2}}; color: {{text}}">DPL</div>
      </div>
      <div style="flex-grow: 1; min-width: 130px">
        <div style="font-size: 12px; color: {{meta}}">이름</div>
        <div class="field" style="border: 1px solid {{line}}; background: {{card2}}; color: {{faint}}">클랜명</div>
      </div>
    </div>
  </div>

  <!-- ── 클랜 알 목록 ───────────────────────────────────── -->
  <!-- 모바일에서는 표를 쓰지 않는다 — [깨기] 가 화면 밖으로 밀려 안 닿았다 -->
  <div style="margin-top: 30px">
    <div class="sechead" style="border-bottom: 1px solid {{lineSoft}}; color: {{textStrong}}">클랜 알</div>

    <div class="eggrow" style="border-bottom: 1px solid {{lineSoft}}">
      <div style="min-width: 0; flex-grow: 1">
        <div class="eggname" style="color: {{textStrong}}">desperado.</div>
        <div class="eggmeta" style="color: {{meta}}">
          <span>DPL</span><span>1부</span>
          <span class="badge" style="border: 1px solid {{lineSoft}}; color: {{faint}}">잠김</span>
        </div>
      </div>
      <div class="btn" style="border: 1px solid {{line}}; color: {{text}}">깨기</div>
    </div>

    <div class="eggrow" style="border-bottom: 1px solid {{lineSoft}}">
      <div style="min-width: 0; flex-grow: 1">
        <div class="eggname" style="color: {{textStrong}}">MiraGe.</div>
        <div class="eggmeta" style="color: {{meta}}">
          <span>DPL</span><span>1부</span>
          <span class="badge" style="border: 1px solid {{accent}}; color: {{accent}}">관리자 강제</span>
        </div>
      </div>
      <div class="btn" style="border: 1px solid {{line}}; color: {{text}}">되잠금</div>
    </div>

    <div class="eggrow" style="border-bottom: 1px solid {{lineSoft}}">
      <div style="min-width: 0; flex-grow: 1">
        <div class="eggname" style="color: {{textStrong}}">eternalrz</div>
        <div class="eggmeta" style="color: {{meta}}">
          <span>DPL</span><span>1부</span>
          <span class="badge" style="border: 1px solid {{lineSoft}}; color: {{faint}}">잠김</span>
        </div>
      </div>
      <div class="btn" style="border: 1px solid {{line}}; color: {{text}}">깨기</div>
    </div>

    <div class="eggrow" style="border-bottom: 1px solid {{lineSoft}}">
      <div style="min-width: 0; flex-grow: 1">
        <div class="eggname" style="color: {{textStrong}}">One.PoinT</div>
        <div class="eggmeta" style="color: {{meta}}">
          <span>DPL</span><span>2부</span>
          <span class="badge" style="border: 1px solid {{lineSoft}}; color: {{faint}}">잠김</span>
        </div>
      </div>
      <div class="btn" style="border: 1px solid {{line}}; color: {{text}}">깨기</div>
    </div>

    <div class="eggrow" style="border-bottom: 1px solid {{lineSoft}}">
      <div style="min-width: 0; flex-grow: 1">
        <div class="eggname" style="color: {{textStrong}}">dravelior</div>
        <div class="eggmeta" style="color: {{meta}}">
          <span>DPL</span><span>2부</span>
          <span class="badge" style="border: 1px solid {{lineSoft}}; color: {{faint}}">잠김</span>
        </div>
      </div>
      <div class="btn" style="border: 1px solid {{line}}; color: {{text}}">깨기</div>
    </div>

    <div class="eggrow">
      <div style="min-width: 0; flex-grow: 1">
        <div class="eggname" style="color: {{textStrong}}">AimEnvy</div>
        <div class="eggmeta" style="color: {{meta}}">
          <span>DPL</span><span>3부</span>
          <span class="badge" style="border: 1px solid {{lineSoft}}; color: {{faint}}">잠김</span>
        </div>
      </div>
      <div class="btn" style="border: 1px solid {{line}}; color: {{text}}">깨기</div>
    </div>
  </div>

</div>
</x-dc>

<script data-dc-script data-props='{
  "bg":         {"editor":"color","default":"#060505","options":["#060505","#0a0808","#000000","#101010"],"section":"바탕"},
  "card2":      {"editor":"color","default":"#1a1010","options":["#1a1010","#221414","#120c0c"],"section":"바탕"},
  "line":       {"editor":"color","default":"#2a1616","options":["#2a1616","#3a1c1c","#241616","#1f1414"],"section":"선"},
  "lineSoft":   {"editor":"color","default":"#1a1010","options":["#1a1010","#221414","#141010"],"section":"선"},
  "textStrong": {"editor":"color","default":"#f6eded","options":["#f6eded","#ffffff","#ece0e0"],"section":"글자"},
  "text":       {"editor":"color","default":"#d6c9c9","options":["#d6c9c9","#c9bcbc","#e2d6d6"],"section":"글자"},
  "meta":       {"editor":"color","default":"#9a8080","options":["#9a8080","#8a7272","#a89090"],"section":"글자"},
  "faint":      {"editor":"color","default":"#6b5555","options":["#6b5555","#7a6161","#5a4747"],"section":"글자"},
  "accent":     {"editor":"color","default":"#d92b2b","options":["#d92b2b","#ff3d3d","#f2711c","#2185d0"],"section":"강조"}
}'>
class Component extends DCLogic {
  renderVals() {
    const p = this.props
    return {
      bg:         p.bg         ?? '#060505',
      card2:      p.card2      ?? '#1a1010',
      line:       p.line       ?? '#2a1616',
      lineSoft:   p.lineSoft   ?? '#1a1010',
      textStrong: p.textStrong ?? '#f6eded',
      text:       p.text       ?? '#d6c9c9',
      meta:       p.meta       ?? '#9a8080',
      faint:      p.faint      ?? '#6b5555',
      accent:     p.accent     ?? '#d92b2b',
    }
  }
}
</script>
</body>
</html>
