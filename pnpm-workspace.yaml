packages:
  - "apps/*"
  - "packages/*"

# 설치 시 스크립트 실행을 허용한 패키지 (pnpm 11 정책)
# - msw: 브라우저용 Service Worker 설치 도우미
# - sharp: Next.js 이미지 최적화 네이티브 바이너리
# - prisma / @prisma/*: 쿼리 엔진 바이너리 내려받기 + 클라이언트 생성
# - @embedded-postgres/windows-x64: 로컬 개발용 PostgreSQL 바이너리 (개발 전용, D-022)
# - esbuild: tsx(시드·스크립트용 TS 실행기)의 네이티브 바이너리
allowBuilds:
  '@embedded-postgres/windows-x64': true
  '@prisma/client': true
  '@prisma/engines': true
  esbuild: true
  msw: true
  prisma: true
  sharp: true
