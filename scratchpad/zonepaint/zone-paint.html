<title>바닥 구역 칠하기</title>
<style>
  :root {
    --ground: #06090f;
    --panel: #131c2e;
    --line: #22304c;
    --line-soft: #1a2338;
    --ink: #eef3ff;
    --meta: #9aa9c6;
    --faint: #647392;
    --erase: #ff6b7a;
    color-scheme: dark;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    margin: 0; background: var(--ground); color: var(--ink);
    font: 14px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", "Malgun Gothic",
      "Apple SD Gothic Neo", "Noto Sans KR", sans-serif;
    overscroll-behavior: none;
    /* ★가로로 넘치면 버튼이 화면 밖으로 나간다★ — 폰에서 눈으로 확인한 것 */
    overflow-x: hidden;
  }
  .wrap { max-width: 980px; margin: 0 auto; padding: 10px 10px 0; }
  header { display: flex; align-items: baseline; gap: 9px; flex-wrap: wrap; margin-bottom: 8px; }
  h1 { font-size: 16px; font-weight: 800; margin: 0; letter-spacing: -.01em; }
  .sub { font-size: 11px; color: var(--meta); }

  .board {
    position: relative; border: 1px solid var(--line); border-radius: 10px;
    background: #000; overflow: auto; touch-action: none;
    -webkit-overflow-scrolling: touch;
  }
  canvas { display: block; }

  .readout {
    display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
    padding: 7px 2px; font-size: 11.5px; color: var(--meta);
    font-variant-numeric: tabular-nums;
  }
  .readout b { color: var(--ink); font-weight: 700; }
  .chip {
    display: inline-flex; align-items: center; gap: 5px; padding: 2px 8px;
    border: 1px solid var(--line); border-radius: 999px; background: var(--panel);
  }
  .dot { width: 9px; height: 9px; border-radius: 2px; flex: none; }

  .bar {
    position: sticky; bottom: 0; z-index: 3;
    margin: 6px 0 0; padding: 9px 0 calc(9px + env(safe-area-inset-bottom));
    background: linear-gradient(180deg, rgba(6,9,15,.7), var(--ground) 40%);
    border-top: 1px solid var(--line-soft); display: grid; gap: 7px;
  }
  .row { display: flex; gap: 7px; align-items: center; width: 100%; }
  button {
    font: inherit; font-weight: 700; color: var(--ink); background: var(--panel);
    border: 1px solid var(--line); border-radius: 9px; padding: 11px 10px;
    cursor: pointer; flex: 1 1 0; min-width: 0;
  }
  button:active { transform: translateY(1px); }
  button[aria-pressed="true"] { color: #10131c; }
  button.erase[aria-pressed="true"] { background: var(--erase); border-color: var(--erase); color: #2a0a0e; }
  button.ghost { flex: 0 0 auto; background: transparent; color: var(--meta); padding: 11px 13px; }
  button:disabled { opacity: .38; cursor: default; }
  button.save { flex: 1 1 100%; background: #2b5cd8; border-color: #3a6bea; color: #fff; }
  button.save:disabled { background: var(--panel); color: var(--faint); border-color: var(--line); }
  .mini button { padding: 8px 2px; font-size: 12.5px; font-weight: 700; }
  .bar button { flex: 1 1 0; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

  .note {
    margin: 9px 2px 0; padding: 9px 11px; border-left: 3px solid #2b5cd8;
    background: rgba(43,92,216,.08); border-radius: 0 8px 8px 0;
    font-size: 11.5px; color: var(--meta); line-height: 1.6;
  }
  .note b { color: var(--ink); }
  .saved { color: #7fe3a0; } .failed { color: var(--erase); }
  .legend { display: flex; flex-wrap: wrap; gap: 5px; padding: 9px 2px 16px; font-size: 10.5px; color: var(--faint); }
  .legend .chip { font-size: 10.5px; padding: 2px 7px; }
</style>

<div class="wrap">
  <header>
    <h1>구역 칠하기</h1>
    <span class="sub">제3보급창고 · 흰 밝기 = 그 칸에서 죽고 죽인 횟수</span>
  </header>

  <div class="board" id="board"><canvas id="c"></canvas></div>

  <div class="readout">
    <span class="chip"><span class="dot" id="curdot"></span><b id="curname">바닥</b> <b id="count">0</b>칸</span>
    <span id="where">칸을 누르면 여기에 좌표가 뜹니다</span>
  </div>

  <div class="bar">
    <div class="row mini" id="zonepick" style="flex-wrap:wrap"></div>
    <div class="row">
      <button id="paint" aria-pressed="true">칠하기</button>
      <button id="erase" class="erase" aria-pressed="false">지우개</button>
      <button id="undo" class="ghost" disabled>되돌리기</button>
    </div>
    <div class="row mini">
      <button data-size="1" aria-pressed="true">붓 1칸</button>
      <button data-size="2" aria-pressed="false">2칸</button>
      <button data-size="3" aria-pressed="false">3칸</button>
    </div>
    <div class="row mini">
      <button data-zoom="1" aria-pressed="true">전체</button>
      <button data-zoom="2" aria-pressed="false">2배</button>
      <button data-zoom="3" aria-pressed="false">3배</button>
      <button data-zoom="4" aria-pressed="false">4배</button>
    </div>
    <div class="row"><button class="save" id="save" disabled>저장</button></div>
  </div>

  <div class="note" id="note">
    <b>일문</b>을 칠해 주세요 — B방어율 판정에 씁니다.
    앞서 칠하신 여섯(바닥·2층·중길·숏·니은자·쓰리깡·설대앞)은 ★그대로★ 깔려 있습니다.
    위 칸으로 구역을 바꿔 가며 칠하세요.
    좁은 데는 <b>2배·3배·4배</b>로 키우고 지도를 밀어 움직이면 됩니다.
    고치실 게 있으면 지우개로 고치셔도 됩니다 — 저장하면 그 상태로 덮어씁니다.
    저장을 누르면 제 세션이 바로 받습니다.
  </div>

  <div class="legend" id="legend"></div>
</div>

<script src="paint-data.js"></script>
<script>
(() => {
  const D = window.__ZONE_DATA__
  const B = D.bounds
  const X0 = B.minX, X1 = B.maxX, Y0 = B.minY, Y1 = B.maxY
  const COLS = X1 - X0 + 1, ROWS = Y1 - Y0 + 1

  /* 새로 칠할 구역들 — 사장님이 「이층도 칠해줄게」 하셔서 둘로 연다 */
  const NEW_ZONES = [
    { key: 'BADAK', label: '바닥', color: '#ffc94d' },
    { key: 'ICHUNG', label: '2층', color: '#5ce6a8' },
    /* ★2026-09-17 추가★ — 사장님: 「중길이랑 숏 니은자까지 내가 칠해줄 수 있어」 */
    { key: 'JUNGGIL', label: '중길', color: '#ff8fb1' },
    { key: 'SHORT', label: '숏', color: '#7ab8ff' },
    { key: 'NIEUN', label: '니은자', color: '#c79bff' },
    /* ★사장님: 「쓰리깡이랑 설대앞도 어딘지 알려줄게」 (2026-09-17) */
    { key: 'THREEKKANG', label: '쓰리깡', color: '#ffa04d' },
    { key: 'SEOLDAEAP', label: '설대앞', color: '#4de0d8' },
    /* ★사장님: 「b방어실패 더 디테일하게 알려줄게 일문을 칠해야해」 (2026-09-17) */
    { key: 'ILMUN', label: '일문', color: '#ff6b6b' },
  ]
  const painted = {
    BADAK: new Set(), ICHUNG: new Set(),
    JUNGGIL: new Set(), SHORT: new Set(), NIEUN: new Set(),
    THREEKKANG: new Set(), SEOLDAEAP: new Set(), ILMUN: new Set(),
  }
  /*
   * ★벙커도 바닥이다★ (2026-09-17 사장님: 「생각해보니 벙커도 바닥임」).
   *   처음에는 「바닥(벙커x)」 이셔서 빼라고 적어 둥다. 정정하셨다.
   *   그래서 벙커 27칸을 ★미리 칠해 둔 상태로★ 시작한다 — 그만큼 덜 칠하시면 된다.
   *   빼고 싶으시면 지우개로 지우시면 된다.
   */
  /*
   * ★사장님이 이미 칠하신 바닥·2층을 그대로 깔아 둔다★ (2026-09-17 저장본).
   *   다시 칠하시지 않아도 되고, 고치고 싶으면 지우개로 고치시면 된다.
   *   벙커는 바닥에 들어 있다 — 「생각해보니 벙커도 바닥임」.
   */
  for (const k in (D.saved || {})) {
    const z = D.saved[k]
    if (painted[z] !== undefined) painted[z].add(k)
  }
  let cur = 'BADAK'
  const history = []

  /* 이미 칠해둔 9구역 — 배경 참고용 */
  const ZONE_HUE = {
    BIRONG: 205, BUNKER: 0, CONDWI: 275, DALBANG: 140,
    GJA: 35, HOLJEONG: 320, MERI: 180, NOKDWI: 95, SEOLDAE: 250,
  }
  /* 구역마다 글자를 한 번만 — 칸들의 가운데에 */
  const zoneCenter = {}
  {
    const acc = {}
    for (const k in D.zone) {
      const z = D.zone[k]
      const p = k.split(',')
      const a = acc[z] || (acc[z] = { x: 0, y: 0, n: 0 })
      a.x += Number(p[0]); a.y += Number(p[1]); a.n += 1
    }
    for (const z in acc) zoneCenter[z] = [acc[z].x / acc[z].n, acc[z].y / acc[z].n]
  }

  /*
   * ★밝기 — 이게 흐려서 안 보였다★ (사장님: 「이게 뭐야 보이지도 않아」).
   *   처음엔 어두운 파랑에 sqrt 였다. 어두운 바탕 위에 어두운 색이라 맵이 안 떴다.
   *   흰색으로 바꾸고 ^0.32 로 눌러 ★낮은 값도 확실히 보이게★ 한다.
   *   맵 구조(복도·방)가 드러나야 어디를 칠하는지 안다.
   */
  let maxD = 1
  for (const k in D.dens) { const a = D.dens[k]; maxD = Math.max(maxD, a[0] + a[1]) }
  const heatOf = (x, y) => {
    const a = D.dens[x + ',' + y]
    if (!a) return 0
    const t = (a[0] + a[1]) / maxD
    return Math.pow(t, 0.32)
  }

  const cv = document.getElementById('c')
  const ctx = cv.getContext('2d')
  const board = document.getElementById('board')
  let zoom = 1
  let cell = 8

  function layout() {
    const w = board.clientWidth
    const base = Math.max(5, w / COLS)
    cell = Math.max(5, Math.round(base * zoom))
    const dpr = Math.min(window.devicePixelRatio || 1, 2)
    cv.width = Math.round(COLS * cell * dpr)
    cv.height = Math.round(ROWS * cell * dpr)
    cv.style.width = (COLS * cell) + 'px'
    cv.style.height = (ROWS * cell) + 'px'
    /* 전체(1배)일 때는 지도가 통째로 보여야 한다 — 귀통이만 보이면 어디를 칠하는지 모른다 */
    const want = ROWS * cell + 2
    board.style.height = (zoom === 1 ? want : Math.min(Math.round(window.innerHeight * 0.5), want)) + 'px'
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0)
    draw()
  }

  function draw() {
    ctx.fillStyle = '#000'
    ctx.fillRect(0, 0, COLS * cell, ROWS * cell)

    for (let gy = Y0; gy <= Y1; gy += 1) {
      for (let gx = X0; gx <= X1; gx += 1) {
        const px = (gx - X0) * cell, py = (gy - Y0) * cell
        const key = gx + ',' + gy

        const h = heatOf(gx, gy)
        if (h > 0) {
          ctx.fillStyle = 'rgba(232,242,255,' + (0.10 + h * 0.85).toFixed(3) + ')'
          ctx.fillRect(px, py, cell, cell)
        }

        const z = D.zone[key]
        if (z) {
          ctx.fillStyle = 'hsla(' + (ZONE_HUE[z] ?? 210) + ',85%,55%,.34)'
          ctx.fillRect(px, py, cell, cell)
        }

        for (const nz of NEW_ZONES) {
          if (painted[nz.key].has(key)) {
            ctx.fillStyle = nz.color
            ctx.globalAlpha = 0.86
            ctx.fillRect(px, py, cell, cell)
            ctx.globalAlpha = 1
          }
        }
      }
    }

    if (cell >= 8) {
      ctx.strokeStyle = 'rgba(255,255,255,.07)'
      ctx.lineWidth = 1
      ctx.beginPath()
      for (let i = 0; i <= COLS; i += 1) { ctx.moveTo(i * cell + .5, 0); ctx.lineTo(i * cell + .5, ROWS * cell) }
      for (let j = 0; j <= ROWS; j += 1) { ctx.moveTo(0, j * cell + .5); ctx.lineTo(COLS * cell, j * cell + .5) }
      ctx.stroke()
    }

    /* 구역 이름 — 어디가 어딘지 알아야 칠할 수 있다 */
    /* ★이름은 언제나 그린다★ — 어디가 뭐지 모르면 칠할 수가 없다.
       폰 전체보기에서는 칸이 8px 라 예전 조건(9px 이상)에 걸려 하나도 안 떴다 */
    {
      ctx.font = '800 ' + Math.max(11, Math.round(cell * 1.15)) + 'px -apple-system, "Malgun Gothic", sans-serif'
      ctx.textAlign = 'center'
      ctx.textBaseline = 'middle'
      for (const z in zoneCenter) {
        const c = zoneCenter[z]
        const px = (c[0] - X0 + .5) * cell, py = (c[1] - Y0 + .5) * cell
        const name = D.labels[z] || z
        ctx.lineWidth = 3
        ctx.strokeStyle = 'rgba(0,0,0,.85)'
        ctx.strokeText(name, px, py)
        ctx.fillStyle = 'hsl(' + (ZONE_HUE[z] ?? 210) + ',95%,82%)'
        ctx.fillText(name, px, py)
      }
    }

    document.getElementById('count').textContent = painted[cur].size
    document.getElementById('save').disabled = painted.BADAK.size + painted.ICHUNG.size === 0
    document.getElementById('undo').disabled = history.length === 0
  }

  /* ── 칠하기 · 밀기 ── */
  let mode = 'paint', brush = 1
  let drawing = false, panning = false, stroke = null
  let panFrom = null

  function cellAt(ev) {
    const r = cv.getBoundingClientRect()
    const gx = X0 + Math.floor((ev.clientX - r.left) / cell)
    const gy = Y0 + Math.floor((ev.clientY - r.top) / cell)
    if (gx < X0 || gx > X1 || gy < Y0 || gy > Y1) return null
    return [gx, gy]
  }
  function apply(gx, gy) {
    const half = Math.floor((brush - 1) / 2)
    for (let dy = -half; dy <= brush - 1 - half; dy += 1) {
      for (let dx = -half; dx <= brush - 1 - half; dx += 1) {
        const x = gx + dx, y = gy + dy
        if (x < X0 || x > X1 || y < Y0 || y > Y1) continue
        const key = x + ',' + y
        const set = painted[cur]
        if (mode === 'paint') { if (!set.has(key)) { set.add(key); stroke.add(key) } }
        else if (set.has(key)) { set.delete(key); stroke.add(key) }
      }
    }
  }
  function report(gx, gy) {
    const key = gx + ',' + gy
    const z = D.zone[key]
    const a = D.dens[key] || [0, 0, 0, 0]
    document.getElementById('where').innerHTML =
      '<b>' + gx + ',' + gy + '</b> · ' + (z ? (D.labels[z] || z) : '이름 없는 자리')
      + ' · 킬 ' + a[0] + ' 데스 ' + a[1]
  }

  cv.addEventListener('pointerdown', (ev) => {
    const c = cellAt(ev)
    ev.preventDefault()
    cv.setPointerCapture(ev.pointerId)
    /* 두 손가락이거나 오른쪽 버튼이면 민다 */
    if (ev.button === 1 || ev.button === 2) {
      panning = true; panFrom = { x: ev.clientX, y: ev.clientY, l: board.scrollLeft, t: board.scrollTop }
      return
    }
    if (!c) return
    drawing = true; stroke = new Set()
    apply(c[0], c[1]); report(c[0], c[1]); draw()
  })
  cv.addEventListener('pointermove', (ev) => {
    if (panning && panFrom) {
      board.scrollLeft = panFrom.l - (ev.clientX - panFrom.x)
      board.scrollTop = panFrom.t - (ev.clientY - panFrom.y)
      return
    }
    const c = cellAt(ev); if (!c) return
    if (!drawing) { report(c[0], c[1]); return }
    ev.preventDefault()
    apply(c[0], c[1]); report(c[0], c[1]); draw()
  })
  const stop = () => {
    panning = false; panFrom = null
    if (!drawing) return
    drawing = false
    if (stroke && stroke.size > 0) history.push({ zone: cur, mode, keys: [...stroke] })
    stroke = null
    draw()
  }
  cv.addEventListener('pointerup', stop)
  cv.addEventListener('pointercancel', stop)

  document.getElementById('undo').addEventListener('click', () => {
    const last = history.pop(); if (!last) return
    const set = painted[last.zone]
    for (const k of last.keys) { if (last.mode === 'paint') set.delete(k); else set.add(k) }
    draw()
  })

  const paintBtn = document.getElementById('paint'), eraseBtn = document.getElementById('erase')
  const curColor = () => (NEW_ZONES.find((z) => z.key === cur) || NEW_ZONES[0]).color
  const setMode = (m) => {
    mode = m
    paintBtn.setAttribute('aria-pressed', String(m === 'paint'))
    eraseBtn.setAttribute('aria-pressed', String(m === 'erase'))
    paintBtn.style.background = m === 'paint' ? curColor() : ''
    paintBtn.style.borderColor = m === 'paint' ? curColor() : ''
  }
  paintBtn.addEventListener('click', () => setMode('paint'))
  eraseBtn.addEventListener('click', () => setMode('erase'))

  for (const b of document.querySelectorAll('[data-size]')) {
    b.addEventListener('click', () => {
      brush = Number(b.dataset.size)
      for (const o of document.querySelectorAll('[data-size]')) o.setAttribute('aria-pressed', String(o === b))
      b.style.background = '';
    })
  }
  for (const b of document.querySelectorAll('[data-zoom]')) {
    b.addEventListener('click', () => {
      zoom = Number(b.dataset.zoom)
      for (const o of document.querySelectorAll('[data-zoom]')) o.setAttribute('aria-pressed', String(o === b))
      layout()
    })
  }

  /* 구역 고르기 */
  const pick = document.getElementById('zonepick')
  pick.innerHTML = NEW_ZONES.map((z) =>
    '<button data-zone="' + z.key + '" aria-pressed="' + (z.key === cur) + '">' + z.label + '</button>').join('')
  const syncPick = () => {
    for (const b of pick.querySelectorAll('[data-zone]')) {
      const on = b.dataset.zone === cur
      b.setAttribute('aria-pressed', String(on))
      const z = NEW_ZONES.find((n) => n.key === b.dataset.zone)
      b.style.background = on ? z.color : ''
      b.style.borderColor = on ? z.color : ''
    }
    const z = NEW_ZONES.find((n) => n.key === cur)
    document.getElementById('curname').textContent = z.label
    document.getElementById('curdot').style.background = z.color
    setMode(mode)
    draw()
  }
  pick.addEventListener('click', (ev) => {
    const b = ev.target.closest('[data-zone]'); if (!b) return
    cur = b.dataset.zone; syncPick()
  })

  /* ── 저장 ── */
  const note = document.getElementById('note')
  document.getElementById('save').addEventListener('click', async () => {
    const btn = document.getElementById('save')
    btn.disabled = true; btn.textContent = '저장하는 중…'
    try {
      const db = await window.claude?.use?.('db')
      if (!db) throw new Error('db-off')
      const payload = { cell: D.cell, savedAt: new Date().toISOString(), zones: {} }
      for (const z of NEW_ZONES) {
        payload.zones[z.key] = { label: z.label, cells: [...painted[z.key]].sort(), count: painted[z.key].size }
      }
      await db.doc('zones/NEW').set(payload)
      btn.textContent = '저장됨 ✓'
      note.innerHTML = '<b class="saved">저장했습니다 — 바닥 ' + painted.BADAK.size
        + '칸 · 2층 ' + painted.ICHUNG.size + '칸.</b> 제 세션이 바로 읽습니다. 더 칠하고 다시 눌러도 됩니다.'
      setTimeout(() => { btn.textContent = '저장'; btn.disabled = false }, 1200)
    } catch (err) {
      btn.textContent = '저장'; btn.disabled = false
      note.innerHTML = '<b class="failed">저장을 못 했습니다.</b> 한 번 더 눌러 보세요. ('
        + ((err && err.code) || (err && err.message) || '?') + ')'
    }
  })

  document.getElementById('legend').innerHTML =
    NEW_ZONES.map((z) => '<span class="chip"><span class="dot" style="background:' + z.color + '"></span>' + z.label + ' (새로)</span>').join('')
    + Object.keys(D.labels).map((k) =>
        '<span class="chip"><span class="dot" style="background:hsla(' + (ZONE_HUE[k] ?? 210) + ',85%,60%,.8)"></span>'
        + D.labels[k] + '</span>').join('')

  window.addEventListener('resize', layout)
  syncPick()
  layout()
})()
</script>
