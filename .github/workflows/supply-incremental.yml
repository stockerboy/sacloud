# 3rd.supply 실시간 증분 동기화 (D-153 · D-155 · D-157 · **D-168**)
#
# ── 무엇을 하는가
#   원본(3rd.supply)에 새로 쌓인 경기를 **5분마다** 새것만 받아 우리 DB 에 넣고,
#   그 경기가 건드린 선수만 다시 집계한다.
#
#     supply-mirror --incremental --seen-from-db --adaptive
#                                                  원본 공개 API → 새 경기만 JSONL
#     supply-import --confirm                      JSONL → DB (네트워크 안 씀 · idempotent)
#     supply-rollup --confirm                      **증분** 집계 → LeaguePlayer · LeagueClan
#     db-snapshot                                  행 수 · 무결성 검사 (읽기만)
#
#   전수 집계는 없앤 것이 아니라 **하루 1회 별도 워크플로**로 옮겼다
#   (`supply-rollup-full.yml`). 증분 값이 어긋나면 그것이 되돌려 놓는다.
#
# ── 왜 cron 을 `*/5` 로 적지 않는가  ← 이 파일에서 가장 중요한 판단
#   GitHub Actions 의 예약 실행은 **정시성이 나쁘다.** 부하가 몰리면 밀리고,
#   심하면 그 회차가 통째로 버려진다. `*/5` 로 적어도 실제 간격은 5분이 아니다.
#   게다가 회차마다 체크아웃 · `pnpm install` · `prisma generate` 에 **1~2분**이 든다 —
#   5분 주기라면 그 고정비가 전체의 30% 다.
#
#   그래서 **한 번 실행 안에서 5분 간격으로 여러 사이클을 돈다.**
#   준비는 한 번만 하고, 사이클 간격은 GitHub 이 아니라 **우리 시계**가 정한다.
#   예약이 밀려도 다음 실행이 그 자리를 덮으므로 데이터가 새지 않는다 —
#   수집은 언제나 목록 맨 앞부터 보고, 집계 창은 24시간이라 사이클을 건너뛰어도 겹친다.
#
#   30분마다 시작해 **27분 동안** 5분 간격으로 돈다(사이클 6회). 다음 예약이
#   기다리지 않도록 3분을 비워 둔다 (`concurrency` 가 취소가 아니라 대기이므로).
#
# ── 왜 요청이 늘지 않는가 (CLAUDE.md 3-A 5번)
#   주기를 6배로 당기면서 **요청은 오히려 줄었다.** 두 가지를 고쳤다.
#
#   1. `--adaptive` — 클랜별 활동량으로 티어를 나눠 **볼 차례인 클랜만** 훑는다
#      (`apps/worker/src/lib/supplyPollingPolicy.ts`). 190개 전부가 아니라 평균 27개다.
#   2. 클랜의 원본 `league_clan` id 를 **DB 에서 읽는다.** 예전에는 사이클마다
#      `/clans/{slug}/show` 를 190건 보냈다. 우리가 이미 아는 값이다 (3-A 3번).
#
#   실측(로컬 DB · 최근 14일 · 등록 클랜 190 · 경기 2,209건으로 5분 사이클 4,032회 시뮬레이션):
#
#                              지금(30분)      새 설계(5분)
#     클랜 경기목록 요청/시간      380              328
#     클랜 show 요청/시간          380                0
#     클랜랭킹 페이지/시간          28              168
#     경기 상세/시간                 7                7
#     ─────────────────────────────────────────────────
#     **합계 요청/시간**           795              502     ← 37% 감소
#
#   `docs/DECISIONS.md` D-168 에 계산 근거가 있다.
#   원본에 대한 예의로 동시 요청 3 · 간격 250ms 는 그대로 둔다.
#
# ── 조용한 클랜을 놓치지 않는 보장
#   티어는 굶기지 않는다. 어떤 클랜이든 자기 주기마다 **정확히 한 번** 차례가 오고,
#   가장 낮은 `dormant` 도 **24시간에 한 번은 반드시** 훑는다 (실측 최장 미조회 24.0시간).
#   상한(`SUPPLY_POLL_MAX_CLANS`)에 걸려 미뤄져도 다음 차례에 다시 온다.
#   새로 등록된 클랜은 차례를 기다리지 않고 그 사이클에 바로 훑는다 (D-168).

name: 3rd.supply 증분 동기화

on:
  schedule:
    # UTC 기준. 매시 정각·30분에 시작해 **한 실행 안에서 5분 간격으로 6회** 돈다
    #
    # ── 19시(UTC)만 비어 있다 — 일부러 비웠다 (2026-09-01 · D-224)
    #   전수 집계(`supply-rollup-full.yml`)가 UTC 19:00 에 뜨는데, 두 워크플로가
    #   같은 `concurrency` 그룹(`supply-pipeline`)이다. 그런데 GitHub 은 그룹마다
    #   **대기 자리를 하나만** 준다 — 대기 중인 run 이 있는데 새 run 이 오면
    #   **대기하던 쪽이 취소된다.**
    #   실측: 전수 집계 run 3건이 **전부 cancelled**. 한 번도 돈 적이 없다.
    #   증분이 30분마다 밀고 들어와 매번 밀어냈기 때문이다.
    #   그래서 그 한 시간을 비워 전수 집계가 들어갈 자리를 만든다.
    #
    # ── `0,30` 이 아니라 `7,37` 이다 — 일부러 어긋냈다 (2026-09-01 · D-225)
    #   GitHub 은 「매시 정각 부근이 고부하이고, 부하가 높으면 예약이 **버려질 수 있다**」고
    #   문서에 적어 두었다. 우리가 쓰던 `0,30` 은 그 두 분이다.
    #   실측(08-28~08-31 · 예약 슬롯 153칸): **발사 17칸 · 드롭 136칸(89%)** ·
    #   지연 중앙값 21분. 어중간한 분으로 옮겨 부하 봉우리를 피한다.
    #
    # ── 그리고 **이제 예약은 후퇴값이다** (아래 self-dispatch 스텝)
    #   드롭 136칸 중 109칸은 그 순간 아무것도 안 돌고 있었다 — 대기·취소가 아니라
    #   GitHub 스케줄러가 이벤트를 안 보낸 것이다. 그래서 신선도를 예약에 걸지 않는다.
    #   잡이 끝나면서 **자기 자신을 `workflow_dispatch` 로 다시 부른다.**
    #   이 예약은 그 체인이 끊겼을 때 되살리는 용도로만 남긴다.
    # ── ⚠ **철회 (2026-09-01 · D-249)** — 밤에만 돌리려다 되돌렸다
    #
    #   낮에 500 이 나는 것을 막으려고 수집을 `17,18,20-23`(KST 02~09시)로 좁혔었다.
    #   사용자가 바로 막았다 —
    #     «아 근데 진짜 안되는데 **실시간 기록은 가져가야하는데 늦어도 15분내로는 찍혀야**하는데»
    #
    #   맞는 지적이다. 전적 사이트에서 «어제 경기까지만 보임» 은 기능이 없는 것과 같다.
    #   **신선도는 협상 대상이 아니다.** 그래서 하루 종일로 되돌리고,
    #   대신 **사이트가 DB 없이도 답하게** 만드는 쪽으로 방향을 바꿨다 (D-249 본문).
    - cron: '7,37 0-18,20-23 * * *'

  # ── 체인에 **시동**을 건다 (2026-09-01 · D-229)
  #
  #   자기호출은 「잡이 끝날 때 다음 잡을 부른다」라서 **첫 한 번은 누가 시작해야 한다.**
  #   그런데 그 첫 한 번이 바로 89% 드롭되는 예약이다 — 닭과 달걀이다.
  #   실측(08-31 19:00Z): 마지막 run 이후 9시간째 예약이 한 번도 오지 않았다.
  #
  #   그래서 **이 파일을 고쳐 푸시하면 한 번 돈다.** 다음 푸시가 곧 시동이다.
  #   덤으로 이것은 **파이프라인을 고쳤을 때 즉시 도는 연기 시험**이기도 하다 —
  #   워크플로를 바꿔 놓고 다음 예약까지 몇 시간을 기다려 확인하던 것이 D-224 의 실패였다.
  #
  #   `paths` 로 이 파일 하나에 묶는다. 코드 푸시마다 도는 것이 아니다.
  #
  # ── 왜 cron 슬롯을 늘려서 시동 확률을 올리지 않는가
  #   `7,22,37,52`(시간당 4회)로 늘리면 시동 기대시간이 4.5h → 2.3h 로 준다.
  #   그런데 체인이 도는 평상시에는 체인(~2.7회/시간) + cron(최대 4회/시간)이
  #   **자기호출 폭주 방지 ②(시간당 5건 상한)를 넘겨 체인을 스스로 끊는다.**
  #   시동을 빨리 걸려다 정상 동작을 깨는 셈이라, 슬롯은 2회로 두고 시동은 여기서 건다.
  push:
    branches: [main]
    paths:
      - '.github/workflows/supply-incremental.yml'

  workflow_dispatch:
    inputs:
      leagues:
        description: '동기화할 리그 slug (쉼표)'
        required: false
        default: 'supply,daerule,sanply'
      dry_run:
        description: '요청도 쓰기도 하지 않고 현황만 본다'
        type: boolean
        required: false
        default: false
      cycles:
        description: '이 실행에서 돌 사이클 수 (기본 6 · 5분 간격)'
        required: false
        default: '6'
      no_adaptive:
        description: '적응형 폴링을 끄고 등록 클랜 전부를 훑는다 (진단용 · 요청이 7배)'
        type: boolean
        required: false
        default: false
      chain:
        description: '자기호출 체인 깊이. **사람은 건드리지 않는다** (폭주 방지용 · D-225)'
        required: false
        default: '0'

# 겹치면 **취소가 아니라 대기**한다.
# 적재·집계가 도는 중에 같은 것을 또 시작하면 같은 행을 두 곳에서 건드린다.
# 진행 중인 쪽을 죽이면 절반만 적재된 상태로 끝나므로 `cancel-in-progress` 는 false 다.
#
# 하루 1회 전수 집계(`supply-rollup-full.yml`)도 **같은 그룹**을 쓴다.
# 두 워크플로가 같은 `LeaguePlayer` 행을 쓰므로 절대 동시에 돌면 안 된다.
concurrency:
  group: supply-pipeline
  cancel-in-progress: false

permissions:
  contents: read
  # 잡이 끝나면서 **자기 자신을 다시 부른다** (D-225). dispatch 에 필요한 최소 권한이다.
  # `actions: write` 는 읽기도 포함한다 — 예약 간격 알람이 `actions/runs` 를 읽는다.
  actions: write

jobs:
  sync:
    name: 5분 사이클 × N — 수집 → 적재 → 증분 집계 → 검증
    runs-on: ubuntu-latest
    # 사이클 예산(20분)에 준비·검증·자기호출을 더한 값보다 넉넉하게. 무한정 붙잡지는 않는다.
    #
    # 40 → 50 (2026-09-01 · D-225). 실측 16건 중 **4건이 40분에 잘렸고**, 잘린 자리는
    # 언제나 step 8 이었다 — 적재 도중일 수 있고, 뒤의 검증 스텝이 통째로 skip 됐다.
    # 예산을 20분으로 줄였으니 평상시에는 35분 안에 끝난다. 이 값은 **안전판**이다.
    #
    # 50 → 70 (2026-09-01 · D-240). **쉬는 시간(15분)을 넣었기 때문**이다.
    # 실측 step 8 중앙값이 31.4분이었고 거기에 준비·검증·쉼(15분)이 얹힌다.
    # 50 그대로 두면 **쉬다가 잘려서 self-dispatch 를 못 하고 체인이 끊긴다.**
    # 늘린 것은 안전판이지 예산이 아니다 — 사이클 예산(1200초)은 그대로다.
    timeout-minutes: 70

    env:
      # 운영 DB. **값을 로그에 찍지 않는다** (GitHub 이 자동 마스킹하지만 우리도 찍지 않는다)
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      # 점수의 주인은 **우리 공식**이다 (D-173).
      # 이게 없으면 이 잡이 30분마다 원본 점수로 되돌려 써서
      # 시즌0 랭킹이 30분 만에 사라진다. 승패·킬데스 같은 기록은 계속 갱신된다.
      SACLOUD_RATING_OWNER: formula
      # 원본 웹 클라이언트 공개 앱 헤더. 앱 버전이 올라가면 403 이 나므로 시크릿으로 갈아끼울 수 있게 둔다.
      # **비워 두면 코드의 기본값을 쓴다** — 빈 문자열을 헤더로 보내면 403 이다 (아래에서 unset 한다)
      SUPPLY_APP_ID: ${{ secrets.SUPPLY_APP_ID }}
      SUPPLY_APP_VER: ${{ secrets.SUPPLY_APP_VER }}
      # 원본에 대한 예의. 대량 수집 때(10 · 130ms)보다 훨씬 느리게 간다
      # ⚠ **3 → 1 (2026-09-01 오후 · D-240 후속).**
      #   사이트와 수집이 같은 DB 한 대를 다투는데, 수집이 **매 run 실패**하면서도
      #   DB 는 계속 갈고 있다 (실패 지점은 신선도 검증이고, DB 가 느려서 빨개진다).
      #   즉 **capacity 를 쓰면서 성과는 못 내는 상태**다.
      #   원본에 대한 예의 이전에 **우리 DB 에 대한 예의**로 낮춘다.
      #   수집이 느려지는 대신 사이트가 산다. DB 가 안정되면 다시 올린다.
      SUPPLY_CONCURRENCY: '1'
      SUPPLY_DELAY_MS: '250'
      # 적응형 폴링의 사이클 길이. **아래 CYCLE_SECONDS 와 같은 값이어야 한다** —
      # 티어별 주기를 사이클 수로 환산하는 기준이라 어긋나면 조회 빈도가 통째로 틀어진다
      SUPPLY_POLL_CYCLE_MINUTES: '5'
      LEAGUES: ${{ inputs.leagues || 'supply,daerule,sanply' }}
      DRY_RUN: ${{ inputs.dry_run || 'false' }}
      NO_ADAPTIVE: ${{ inputs.no_adaptive || 'false' }}
      # 사이클 수 상한과 간격. **실제로 도는 수는 아래 예산이 정한다** —
      # 예산 1200초면 사이클은 0·5·10·15분에 시작하고 20분에서 끊기므로 **4회**다.
      # 이 값은 상한으로만 남는다 (`--cycles` 로 진단할 때 쓴다)
      CYCLES: ${{ inputs.cycles || '6' }}
      CYCLE_SECONDS: '300'
      # 이 시간을 넘기면 **다음 사이클을 시작하지 않는다.**
      #
      # 1620(27분) → 1200(20분) (2026-09-01 · D-225).
      # 이 값은 「새 사이클을 **시작**할지」만 본다. 마지막 사이클의 작업시간은 그 위에
      # 통째로 얹힌다. 그래서 27분 예산인데 실측 step 8 중앙값이 **31.4분**이었고,
      # run 16건 중 13건이 30분을 넘겼다. 20분으로 내리면 마지막 사이클이 길어져도
      # step 8 이 30분 안에 들어온다.
      #
      # ── 사이클이 6회에서 4회로 줄지만 **하루 총량은 오히려 늘어난다**
      #   자기호출 체인에서는 **다음 실행 주기 = 이번 실행 길이**다. 실행이 22분이면
      #   22분마다 새 실행이 뜬다. 실측 기준 하루 5.5회 × 6사이클 = 33사이클이었는데,
      #   체인이 돌면 하루 약 65회 × 4사이클 이다. 짧게 자주 도는 쪽이 신선하다.
      #   준비 고정비가 실측 24초라 자주 시작해도 싸다 (그래서 이 설계가 성립한다).
      # ⚠ **1200 → 900 (2026-09-01 오후 · D-240 후속).**
      #   한 run 이 DB 를 붙잡는 시간을 줄인다. 위 15분 쉼과 합치면
      #   **도는 시간과 쉬는 시간이 엇비슷해진다** — 사이트가 숨 쉴 구간이 실제로 생긴다.
      BUDGET_SECONDS: '900'

    steps:
      # 자기호출 폭주 방지 ③ 「최소 생존시간」의 기준점 (D-225).
      # 잡이 초 단위로 죽고 되살아나는 고리를 막으려면 **언제 시작했는지**를 알아야 한다.
      - name: 시작 시각을 기록한다
        run: echo "JOB_STARTED=$(date +%s)" >> "$GITHUB_ENV"

      - name: 저장소 체크아웃
        uses: actions/checkout@v4

      - name: pnpm 설치
        # 버전은 package.json 의 `packageManager` 를 따른다 (pnpm@11.22.0)
        uses: pnpm/action-setup@v4

      - name: Node 24 설치
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'pnpm'

      - name: 의존성 설치
        run: pnpm install --frozen-lockfile

      - name: Prisma 클라이언트 생성
        run: pnpm --filter @sacloud/db exec prisma generate

      - name: 시크릿 확인 (값은 찍지 않는다)
        run: |
          set -euo pipefail
          if [ -z "${DATABASE_URL:-}" ]; then
            echo "::error::DATABASE_URL 시크릿이 없다. 리포지터리 Settings → Secrets 에 넣는다"
            exit 1
          fi
          echo "DATABASE_URL 설정됨"
          echo "리그: ${LEAGUES}"
          echo "사이클 ${CYCLES}회 × ${CYCLE_SECONDS}초 (예산 ${BUDGET_SECONDS}초)"
          echo "dry-run: ${DRY_RUN} · 적응형 끔: ${NO_ADAPTIVE}"
          echo "원본 속도: 동시 ${SUPPLY_CONCURRENCY} · 간격 ${SUPPLY_DELAY_MS}ms"

      # ── **DB 를 갈기 전에 엣지 캐시를 채운다** (2026-09-01 · D-249)
      #
      # ── 왜 여기인가 — 「채워지질 못하는 캐시」
      #   운영에서 이런 일이 있었다.
      #
      #     /api/maps      MISS → HIT → HIT        ← 정상. 한 번 채워지면 30분 안 때린다
      #     /api/leagues   MISS(500) → MISS(500)   ← 영원히 안 채워진다
      #
      #   엣지 캐시는 **첫 요청 한 번이 DB 까지 성공해야** 채워진다. 그런데 수집이 DB 를
      #   물고 있는 동안에는 그 첫 요청이 500 으로 죽는다. 죽으면 캐시가 안 채워지고,
      #   다음 사람도 «첫 요청» 이 되어 또 죽는다. **악순환이다.**
      #   한 번만 성공시켜 주면 그 뒤 30분은 아무도 DB 를 안 건드린다.
      #
      #   그래서 **수집을 시작하기 직전**에 채운다. 이 시점은 직전 run 의 쿨다운(300초)이
      #   막 끝난 자리라 **DB 가 가장 한가하다.** 여기서 채운 값이 다음 사이클 내내
      #   사람들에게 나간다.
      #
      # ── 왜 `cache-warm.yml` 에 맡기지 않는가
      #   그 워크플로는 `*/5` 예약인데 **GitHub 이 한 번도 발사하지 않았다.**
      #   예약 드롭률이 실측 89% 다 (D-225). 반면 이 워크플로는 자기호출 체인이라
      #   **구조적으로 드롭이 없다.** 신뢰할 수 있는 시계에 얹는다.
      #   `cache-warm.yml` 은 지우지 않는다 — 되살아나면 덤이다 (CLAUDE.md 10-4).
      #
      # ── 실패해도 넘어간다
      #   데우기가 안 됐다고 수집을 멈출 이유가 없다. 데우기는 **덤**이지 전제가 아니다.
      - name: 엣지 캐시를 미리 채운다 (D-249)
        if: ${{ inputs.dry_run != true }}
        continue-on-error: true
        env:
          SITE_URL: ${{ vars.SITE_URL || 'https://sacloud-web-softgw01-8957s-projects.vercel.app' }}
        run: |
          set -u

          # 쿼리스트링까지 **화면이 실제로 보내는 것과 똑같이** 적는다.
          # 엣지 캐시의 키는 전체 URL 이라, `?weapon=all` 을 빼고 데우면
          # 화면이 쓰는 것과 **다른 칸**을 데우게 되어 아무 효과가 없다.
          PATHS="
          /api/remote_configs
          /api/leagues
          /api/home/top
          /api/maps
          /api/boards?category=hot
          /api/eggs/broken
          /api/leagues/supply
          /api/leagues/supply/clans
          /api/leagues/supply/ranks/clans?division=1
          /api/leagues/supply/ranks/players?weapon=all
          /api/leagues/supply/ranks/form?weapon=all
          /api/leagues/nolink
          /api/leagues/nolink/clans
          /api/leagues/nolink/ranks/clans?division=1
          /api/leagues/nolink/ranks/players?weapon=all
          /api/leagues/nolink/ranks/overall?limit=1
          /api/leagues/sanply
          /api/leagues/sanply/ranks/players?weapon=all
          "

          echo "대상: ${SITE_URL}"
          ok=0; bad=0
          for path in $PATHS; do
            # **두 번까지 시도한다.** 한 번 실패하면 그 칸은 30분 내내 비어 있게 되고,
            # 그 사이 들어온 사람이 전부 DB 로 내려간다. 재시도 한 번의 값이 그만큼 크다.
            for attempt in 1 2; do
              code=$(curl -s -o /dev/null                 --max-time 45                 -w '%{http_code}'                 -H 'Accept: application/json'                 -H 'User-Agent: sacloud-cache-warm'                 "${SITE_URL}${path}" || echo 000)
              if [ "$code" = '200' ]; then break; fi
              [ "$attempt" = '1' ] && sleep 5
            done

            if [ "$code" = '200' ]; then
              ok=$(( ok + 1 ))
            else
              bad=$(( bad + 1 ))
              echo "  ${code}  ${path}"
            fi

            # 한꺼번에 때리면 그게 곧 부하다. 접속 통로가 1개라 서로 줄을 선다 (D-239)
            sleep 1
          done

          echo "데움 ${ok}칸 · 실패 ${bad}칸"
          # 실패해도 수집은 계속한다
          exit 0

      - name: 5분 사이클 반복 — 수집 → 적재 → 증분 집계
        id: sync
        run: |
          set -uo pipefail

          # 시크릿을 안 넣었으면 **빈 문자열이 아니라 미설정**이어야 한다.
          # 빈 헤더를 보내면 원본이 403 을 준다 (apps/worker/src/lib/supplyClient.ts)
          if [ -z "${SUPPLY_APP_ID:-}" ]; then unset SUPPLY_APP_ID; fi
          if [ -z "${SUPPLY_APP_VER:-}" ]; then unset SUPPLY_APP_VER; fi

          worker() { pnpm --filter @sacloud/worker nexon "$@"; }

          adaptive_flag='--adaptive'
          if [ "$NO_ADAPTIVE" = 'true' ]; then adaptive_flag=''; fi

          started=$(date +%s)
          # 사이클 하나가 실패해도 **루프를 죽이지 않는다.**
          # 죽이면 남은 25분치 신선도를 통째로 버린다. 파이프라인은 idempotent 라
          # 다음 사이클이 같은 일을 다시 한다. 대신 실패를 세어 **마지막에 잡을 실패시킨다**
          failed=0
          total_new=0

          for cycle in $(seq 1 "$CYCLES"); do
            now=$(date +%s)
            elapsed=$(( now - started ))
            if [ "$cycle" -gt 1 ] && [ "$elapsed" -ge "$BUDGET_SECONDS" ]; then
              echo "예산 ${BUDGET_SECONDS}초를 넘겼다 (${elapsed}초) — 사이클 ${cycle} 부터는 다음 실행에 넘긴다"
              break
            fi

            cycle_started=$now
            echo "::group::사이클 ${cycle}/${CYCLES} (경과 ${elapsed}초)"

            for slug in $(echo "$LEAGUES" | tr ',' ' '); do
              if [ "$DRY_RUN" = 'true' ]; then
                # dry-run 은 **요청을 한 건도 보내지 않는다.** 체크포인트도 만들지 않으므로
                # 뒤의 적재·집계는 돌릴 것이 없다
                worker supply-mirror --league "$slug" --incremental --seen-from-db $adaptive_flag --dry-run || failed=$(( failed + 1 ))
                continue
              fi

              if ! worker supply-mirror --league "$slug" --incremental --seen-from-db $adaptive_flag; then
                echo "::warning::[$slug] 수집 실패 — 이번 사이클은 건너뛰고 다음에 다시 한다"
                failed=$(( failed + 1 ))
                continue
              fi

              # 이번에 새로 받은 것이 있나. `--seen-from-db` 덕분에 이 파일에는
              # **이번 실행에서 새로 받은 경기만** 들어 있다 (러너는 빈 작업공간에서 시작한다).
              # 한 실행 안에서 사이클을 여러 번 도므로 파일은 **누적**된다 —
              # 그래서 줄 수가 아니라 **직전 사이클 이후 늘어난 줄 수**를 본다
              details="packages/db/data/supply-mirror-${slug}.details.jsonl"
              if [ -f "$details" ]; then
                seen_now=$(wc -l < "$details" | tr -d ' ')
              else
                seen_now=0
              fi
              seen_file="${RUNNER_TEMP}/seen-${slug}"
              if [ -f "$seen_file" ]; then seen_before=$(cat "$seen_file"); else seen_before=0; fi
              new_count=$(( seen_now - seen_before ))
              echo "$seen_now" > "$seen_file"

              echo "[$slug] 새 경기 상세 ${new_count}건 (누적 ${seen_now})"
              total_new=$(( total_new + new_count ))

              if [ "$new_count" -le 0 ]; then
                echo "[$slug] 새 경기가 없다 — 적재·집계를 건너뛴다"
                continue
              fi

              # 네트워크를 쓰지 않는다. 이미 있는 경기는 건너뛴다 (idempotent · D-153)
              if ! worker supply-import --league "$slug" --confirm; then
                echo "::warning::[$slug] 적재 실패"
                failed=$(( failed + 1 ))
                continue
              fi

              # **증분** 집계다 (기본값). 방금 적재된 경기가 건드린 선수만 다시 만든다.
              # 전수와 값이 같다는 것은 `apps/worker/src/dev/rollupParity.ts` 로 대조했다 (D-168).
              # 클랜 점수·승패·부리그는 수집 파일 클랜 목록 값을 그대로 쓴다 (D-157).
              if ! worker supply-rollup --league "$slug" --confirm; then
                echo "::warning::[$slug] 집계 실패"
                failed=$(( failed + 1 ))
              fi
            done

            echo '::endgroup::'

            # 다음 사이클 시작까지 남은 시간만 잔다. 사이클 작업이 5분을 넘겼으면 곧바로 다음으로 간다
            if [ "$cycle" -lt "$CYCLES" ]; then
              spent=$(( $(date +%s) - cycle_started ))
              sleep_for=$(( CYCLE_SECONDS - spent ))
              if [ "$sleep_for" -gt 0 ]; then
                echo "다음 사이클까지 ${sleep_for}초 대기 (이번 사이클 ${spent}초)"
                sleep "$sleep_for"
              else
                echo "이번 사이클이 ${spent}초 걸렸다 — 대기 없이 다음으로 간다"
              fi
            fi
          done

          echo "총 새 경기 ${total_new}건 · 실패한 단계 ${failed}건"
          echo "failed=${failed}" >> "$GITHUB_OUTPUT"
          echo "total_new=${total_new}" >> "$GITHUB_OUTPUT"

      # 2026-09-01 — `always()` 를 붙였다 (D-229 후속).
      #   앞 스텝(사이클 루프)이 타임아웃으로 잘리면 이 검증이 **통째로 건너뛰어졌다.**
      #   실측: 40분에 잘린 run 4건에서 무결성 검증이 한 번도 돌지 않았다.
      #
      #   저울질은 이랬다.
      #     붙이면    — 사이클이 중간에 잘린 상태의 검사가 헛알람을 낼 수 있다
      #     안 붙이면 — 그 4건에서 검증이 **통째로 사라진다**
      #   뒤가 더 나쁘다. **헛알람은 시끄럽지만 보이고, skip 은 조용하다.**
      #   조용한 것이 D-224 가 3일을 잃은 이유다.
      #   게다가 이 검사는 「행 수 · FK · 중복」이라 **사이클이 잘려도 참이어야 하는 성질**이다.
      #   잘렸다고 깨질 값이면 그것은 헛알람이 아니라 진짜 결함이다.
      #
      #   ⚠ 조건: **헛알람을 내기 시작하면 그때 조건을 좁힌다.**
      #     울리는데 아무도 안 고치는 상태가 되면 그게 더 나쁘다 (D-224).
      - name: 검증 — 행 수 · 무결성 (읽기만 한다)
        if: ${{ always() && inputs.dry_run != true }}
        # 무결성 검사가 하나라도 깨지면 exit 1 → 잡이 실패한다
        run: pnpm --filter @sacloud/worker nexon db-snapshot --stamp "gha-${{ github.run_id }}"

      # IPL 클랜끼리의 경기가 열산에 새로 쌓였는가 (D-210).
      #
      # 막는 규칙은 `supply-import` 안에 있다. 이 단계는 **그 규칙이 샜는지** 보는 대조다.
      # 0 이 아니면 `nexon ipl-sanply-purge --confirm` 으로 치운다.
      #
      # ⚠ 지금은 **경고만** 한다 (`continue-on-error`). 운영에 아직 치우지 않은 잔여분이
      #   남아 있어서다. 운영을 한 번 치운 뒤에는 이 줄을 지워 **잡을 실패시킨다.**
      # 2026-08-31: 운영 잔여분(23건)을 치웠으므로 **경고에서 실패로 올렸다**.
      # 여기서 빨개지면 차단 규칙(D-210)이 새고 있다는 뜻이다 — 조용히 넘기지 마라.
      #
      # 2026-08-31 추가 — **두 가지를 본다** (D-210 후속).
      #   ① 열산에 남은 IPL끼리의 경기 수
      #   ② **IPL 명단이 마지막 청소 뒤로 바뀌었는가**
      # ②가 없어서 63건이 남았다. 명단에 클랜이 들어오면 그 클랜의 **과거** 열산 경기가
      # 소급해서 「IPL끼리」가 되는데, 유입 차단은 이미 DB 에 있는 경기를 막지 못한다.
      # 그래서 **①이 0이어도 ②가 걸리면 실패한다.**
      # 고치는 법: `ipl-sanply-purge --confirm` 을 돌리고
      #            `packages/db/ops/iplSanplyPurgeLog.ts` 를 갱신한다.
      #
      # 2026-09-01 — `always()` 를 붙였다 (D-224).
      #   앞 스텝(무결성 검증)이 죽으면 이 스텝이 **통째로 건너뛰어진다.** 실제로 그렇게
      #   3일 동안 D-210 알람이 꺼져 있었고, 아무도 몰랐다. 검사가 서로를 가리면 안 된다.
      #   이 검사는 앞 스텝의 결과와 아무 관계가 없다 — 따로 돌고 따로 빨개져야 한다.
      - name: 검증 — 열산에 IPL끼리의 경기가 남았는가 · 명단이 바뀌었는가 (D-210)
        if: ${{ always() && inputs.dry_run != true }}
        run: pnpm --filter @sacloud/worker nexon ipl-sanply-check

      # 증분이 실제로 밀렸는가 (D-225).
      #
      # 임계값은 **리그마다 다르다.** 하나로 묶으면 오경보가 난다 —
      # 운영 최근 8일 경기 간격 실측: sanply 최대 7.1h · supply 최대 18.0h ·
      # daerule 최대 116.3h(8일에 12경기). 근거 표는 `apps/worker/src/jobs/syncFreshness.ts`.
      # sanply 가 가장 예민한 감지기라 여기가 울면 진짜다.
      #
      # ⚠ 이 검사는 **원본이 조용한 것**을 잡지 못한다. 예약이 드롭된 것 자체는
      #   아래 「예약 간격」 스텝이 GitHub `actions/runs` 로 따로 본다.
      - name: 검증 — 증분이 밀렸는가 (신선도 · D-225)
        if: ${{ always() && inputs.dry_run != true }}
        # 잡 CLI 는 stderr 로만 말한다. run 화면에 뜨도록 주석(annotation)을 여기서 붙인다
        run: |
          set -uo pipefail
          if ! pnpm --filter @sacloud/worker nexon sync-freshness --leagues "${LEAGUES}"; then
            echo "::error::증분이 밀렸다 — 위 표의 「밀렸다」 리그를 본다 (D-225)"
            exit 1
          fi

      - name: 이번에 받은 원본 보관 (디버깅용 · 7일)
        if: ${{ always() && inputs.dry_run != true }}
        uses: actions/upload-artifact@v4
        with:
          name: supply-mirror-${{ github.run_id }}
          # 이번 실행에서 **새로 받은 것만** 들어 있다. 원본 응답 그대로다 (3-A 1번)
          path: |
            packages/db/data/supply-mirror-*.json
            packages/db/data/supply-mirror-*.jsonl
          if-no-files-found: ignore
          retention-days: 7

      # ── 다음 실행을 **우리가** 예약한다 (D-225)
      #
      # GitHub 예약 스케줄러는 실측 89% 를 버렸다(153칸 중 17칸만 발사). 그중 80% 는
      # 그 순간 아무것도 안 돌고 있었다 — 대기·취소가 아니라 이벤트가 안 온 것이다.
      # `workflow_dispatch` 는 그 예약 큐를 타지 않으므로 구조적으로 드롭이 없다.
      #
      # ⚠ **아직 실측되지 않았다** `[미확인]`. GitHub 문서는 `GITHUB_TOKEN` 이 만든 이벤트가
      #   새 run 을 만들지 않는다고 하면서 `workflow_dispatch` · `repository_dispatch` 를
      #   **예외로 명시**한다. 그래서 되는 것으로 보고 넣는다. 안 되면 이 체인이 조용히
      #   끊기는데, 그때는 위 `cron`(후퇴값)이 돌고 아래 「예약 간격」 알람이 빨개진다.
      #   즉 **실패해도 조용하지 않다.** 하루만 run 목록을 보면 판정된다.
      #
      # ── 폭주 방지 (세 겹이다. 밤새 도는 것이라 하나로는 부족하다)
      #   ① 체인 깊이 상한 40 — 예약(cron)으로 들어오면 0 으로 리셋된다
      #   ② 최근 1시간 run 수 상한 5 — 잡이 빨리 죽어도 시간당 5회를 못 넘는다
      #   ③ 최소 생존시간 10분 — 초 단위로 죽고 되살아나는 고리를 원천 차단한다
      #   그리고 UTC 19시에는 부르지 않는다. 전수 집계 자리다 (D-224).
      # ⚠ **DB 에게 숨 쉴 구간을 준다** (2026-09-01 · D-240)
      #
      #   사이트와 수집이 **같은 Supabase 한 대**를 쓴다. 그런데 체인이 끝나자마자 다음 run 을
      #   불러서 DB 가 거의 쉬지 않았다. 그날 운영이 이랬다 —
      #     클랜 상세 500 · home/top 500 · 풀러가 `ECHECKOUTTIMEOUT` 으로 고갈
      #   사용자가 «사이트가 탄탄했으면 좋겠어 이렇게 흔들흔들 하는게 싫어» 라고 했다.
      #
      #   접속 수를 늘려 봤지만(1→5) **풀러가 먼저 무너졌다.** 통로를 늘리는 길은 막혔다.
      #   그래서 **수집이 양보한다.** 다음 run 을 부르기 전에 쉰다.
      #
      #   공개 저장소라 러너 시간은 무료다 — 이 기다림에 드는 비용은 없다.
      #   값은 실측으로 다시 정해야 한다. 지금은 «쉬는 구간이 없다» 를 «있다» 로 바꾸는 것이 목적이다.
      - name: DB 가 쉬도록 기다린다 (D-240)
        if: ${{ always() && inputs.dry_run != true }}
        # ── ⚠ **900 → 300 (2026-09-01 · D-249). 신선도가 값을 정한다**
        #
        #   900초(15분)는 사이트에 창구를 양보하려고 끼운 값이었다. 그런데 그러면
        #   **최악의 경우 신선도가 20분**이 된다 — 경기가 run 이 끝난 직후에 나면
        #   쉬는 15분을 다 기다리고, 그 다음 사이클(5분)까지 기다린다.
        #
        #   사용자 요구는 **«늦어도 15분내로는 찍혀야»** 다. 그래서 값을 거꾸로 잡는다.
        #
        #     쉼 300초(5분) + 사이클 간격 300초(5분)  =  **최악 10분**   ← 요구 안에 든다
        #
        #   양보 시간이 줄어드는 만큼은 **사이트 쪽에서 갚는다** — 공개 읽기를
        #   엣지 캐시와 `withLastKnownGood` 로 DB 에서 떼어 놓았다 (D-249 본문).
        #   0 으로 두지 않는 이유는 DB 가 한 run 의 연결을 정리할 틈이 필요해서다 (D-239).
        env:
          COOLDOWN_SECONDS: '300'
        run: |
          echo "다음 수집을 부르기 전에 ${COOLDOWN_SECONDS}초 쉰다 — DB 가 뒷정리할 틈이다 (D-249)"
          sleep "${COOLDOWN_SECONDS}"

      - name: 다음 실행을 스스로 예약한다 (self-dispatch · D-225)
        if: ${{ always() && inputs.dry_run != true }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CHAIN: ${{ inputs.chain || '0' }}
          MAX_CHAIN: '40'
          MAX_RUNS_PER_HOUR: '5'
          MIN_ALIVE_SECONDS: '600'
        run: |
          set -uo pipefail
          next=$(( CHAIN + 1 ))

          alive=$(( $(date +%s) - JOB_STARTED ))
          if [ "$alive" -lt "$MIN_ALIVE_SECONDS" ]; then
            echo "::warning::이 run 이 ${alive}초만에 끝났다 — 체인을 잇지 않는다 (최소 ${MIN_ALIVE_SECONDS}초). cron 후퇴값이 되살린다"
            exit 0
          fi


          if [ "$next" -gt "$MAX_CHAIN" ]; then
            echo "::warning::체인 깊이 ${CHAIN} 이 상한 ${MAX_CHAIN} 에 닿았다 — 여기서 끊는다. cron 이 새 체인을 연다"
            exit 0
          fi

          # ── 전수 집계에 자리를 내준다. **시각으로 자르지 않는다** (D-229 후속)
          #
          #   처음에는 `UTC 19시면 건너뛴다`로 짰다. 첫 실전에서 그게 바로 물렸다 —
          #   run #17 이 19:50Z 에 끝나면서 체인을 스스로 끊었고, 다시 여는 것은
          #   **11% 만 오는 예약**이었다. 시각으로 자르면 **날마다 한 번씩 체인이 죽고
          #   몇 시간씩 못 돌아온다.** 고치려던 병을 하루 한 번 다시 앓는 셈이다.
          #
          #   그래서 「지금 전수 집계가 자리를 기다리는가」를 **실제로 본다.**
          #   기다리는 것이 없으면 19시든 아니든 체인을 잇는다.
          #   기다리는 것이 있으면 물러난다 — 대기 자리가 하나뿐이라 우리가 밀고 들어가면
          #   **대기하던 전수 집계가 취소된다.**
          #   물러난 체인은 전수 집계 워크플로가 끝나면서 다시 열어 준다 (그쪽 마지막 스텝).
          full=$(curl -sS -H "Authorization: Bearer ${GH_TOKEN}" \
          -H 'Accept: application/vnd.github+json' \
          "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/supply-rollup-full.yml/runs?per_page=10" \
          | jq -r '[.workflow_runs[] | select(.status=="queued" or .status=="in_progress" or .status=="waiting" or .status=="pending")] | length')
          if [ -z "$full" ] || [ "$full" = 'null' ]; then
            echo "::warning::전수 집계 상태를 못 읽었다 — 안전한 쪽으로 체인을 끊는다"
            exit 0
          fi
          if [ "$full" -gt 0 ]; then
            echo "전수 집계가 대기·진행 중이다(${full}건) — 자리를 내주고 물러난다. 그쪽이 끝나면서 체인을 다시 연다"
            exit 0
          fi

          since=$(date -u -d '60 minutes ago' +%Y-%m-%dT%H:%M:%SZ)
          recent=$(curl -sS -H "Authorization: Bearer ${GH_TOKEN}" \
          -H 'Accept: application/vnd.github+json' \
          "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/supply-incremental.yml/runs?per_page=100&created=%3E${since}" \
          | jq -r '.total_count // 0')
          if [ -z "$recent" ] || [ "$recent" = 'null' ]; then
            echo "::warning::최근 run 수를 못 읽었다 — 안전한 쪽으로 체인을 끊는다"
            exit 0
          fi
          if [ "$recent" -ge "$MAX_RUNS_PER_HOUR" ]; then
            echo "::error::최근 1시간 run 이 ${recent}건이다 (상한 ${MAX_RUNS_PER_HOUR}) — 폭주로 보고 체인을 끊는다"
            exit 0
          fi

          echo "체인 ${CHAIN} → ${next} · 최근 1시간 ${recent}건 · 생존 ${alive}초 — 다음 실행을 부른다"
          code=$(curl -sS -o /tmp/dispatch.out -w '%{http_code}' -X POST \
          -H "Authorization: Bearer ${GH_TOKEN}" \
          -H 'Accept: application/vnd.github+json' \
          "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/supply-incremental.yml/dispatches" \
          -d "{\"ref\":\"${GITHUB_REF_NAME}\",\"inputs\":{\"chain\":\"${next}\"}}")
          if [ "$code" = '204' ]; then
            echo "다음 실행을 예약했다 (체인 ${next})"
            exit 0
          fi

          # **여기서 잡을 실패시킨다.** 실패해도 조용하지 않아야 한다는 것이 이 설계의 전제다.
          #   · run 로그 본문은 인증이 있어야 읽힌다. 스텝을 초록으로 끝내면 밖에서 보는 사람은
          #     `jobs` API 로 성패를 가릴 수 없다 — 다음 run 이 뜨는지를 몇십 분 기다려야 안다
          #   · 403 이면 `GITHUB_TOKEN` 권한이 모자란 것이고 **PAT 가 필요하다**(사람만 만든다).
          #     그건 조용히 넘길 일이 아니라 화면에 떠 있어야 하는 숙제다
          # 체인이 끊긴 것은 cron 후퇴값이 되살린다 — 빨간 것과 데이터가 새는 것은 다르다.
          echo "::error::self-dispatch 실패 HTTP ${code} — 체인이 끊겼다. cron(7,37) 후퇴값에 맡긴다. 403 이면 PAT 가 필요하다 (D-229)"
          echo "본문: $(head -c 300 /tmp/dispatch.out)"
          exit 1

      # 예약이 실제로 오고 있는가 (D-225).
      #
      # 위 신선도 검사는 **원본이 조용한 것**과 구별이 안 된다. 이건 우리 파이프라인만 본다 —
      # 직전 run 과 이번 run 의 시작 간격이다. 목표 주기는 30분이고, 75분을 넘겼으면
      # 예약이 드롭됐거나 체인이 끊긴 것이다. 실측에서 이 간격은 **중앙값 216분**이었다.
      - name: 검증 — 예약 간격이 벌어졌는가 (D-225)
        if: ${{ always() }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MAX_GAP_MINUTES: '75'
        run: |
          set -uo pipefail
          runs=$(curl -sS -H "Authorization: Bearer ${GH_TOKEN}" \
          -H 'Accept: application/vnd.github+json' \
          "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/supply-incremental.yml/runs?per_page=10")
          this_at=$(echo "$runs" | jq -r --arg id "${GITHUB_RUN_ID}" '.workflow_runs[] | select((.id|tostring)==$id) | .created_at')
          prev_at=$(echo "$runs" | jq -r --arg id "${GITHUB_RUN_ID}" '[.workflow_runs[] | select((.id|tostring)!=$id)] | sort_by(.created_at) | reverse | .[0].created_at // empty')
          if [ -z "$this_at" ] || [ -z "$prev_at" ]; then
            echo "직전 run 을 찾지 못했다 (첫 실행이거나 목록이 비었다) — 판정하지 않는다"
            exit 0
          fi
          gap=$(( ( $(date -u -d "$this_at" +%s) - $(date -u -d "$prev_at" +%s) ) / 60 ))
          echo "직전 ${prev_at} → 이번 ${this_at} · 간격 ${gap}분 (임계 ${MAX_GAP_MINUTES}분)"
          if [ "$gap" -gt "$MAX_GAP_MINUTES" ]; then
            echo "::error::예약 간격이 ${gap}분이다 — 예약이 드롭됐거나 자기호출 체인이 끊겼다 (D-225)"
            exit 1
          fi

      - name: 사이클 실패가 있었으면 잡을 실패시킨다
        # 루프는 신선도를 지키려고 실패를 삼키고 계속 돌았다. **결과까지 삼키지는 않는다**
        if: ${{ always() && steps.sync.outputs.failed != '0' && steps.sync.outputs.failed != '' }}
        run: |
          echo "::error::사이클 중 ${{ steps.sync.outputs.failed }}건이 실패했다 — 로그의 ::warning:: 을 본다"
          exit 1
