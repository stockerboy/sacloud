# 3rd.supply 실시간 증분 동기화 (D-153 · D-155 · D-157 · **D-168**)
#
# ── 무엇을 하는가
#   원본(3rd.supply)에 새로 쌓인 경기를 **5분마다** 새것만 받아 우리 DB 에 넣고,
#   그 경기가 건드린 선수만 다시 집계한다.
#
#     supply-mirror --incremental --seen-from-db --adaptive
#                                                  원본 공개 API → 새 경기만 JSONL
#     supply-import --confirm                      JSONL → DB (네트워크 안 씀 · idempotent)
#     supply-rollup --confirm                      **증분** 집계 → LeaguePlayer · LeagueClan
#     db-snapshot                                  행 수 · 무결성 검사 (읽기만)
#
#   전수 집계는 없앤 것이 아니라 **하루 1회 별도 워크플로**로 옮겼다
#   (`supply-rollup-full.yml`). 증분 값이 어긋나면 그것이 되돌려 놓는다.
#
# ── 왜 cron 을 `*/5` 로 적지 않는가  ← 이 파일에서 가장 중요한 판단
#   GitHub Actions 의 예약 실행은 **정시성이 나쁘다.** 부하가 몰리면 밀리고,
#   심하면 그 회차가 통째로 버려진다. `*/5` 로 적어도 실제 간격은 5분이 아니다.
#   게다가 회차마다 체크아웃 · `pnpm install` · `prisma generate` 에 **1~2분**이 든다 —
#   5분 주기라면 그 고정비가 전체의 30% 다.
#
#   그래서 **한 번 실행 안에서 5분 간격으로 여러 사이클을 돈다.**
#   준비는 한 번만 하고, 사이클 간격은 GitHub 이 아니라 **우리 시계**가 정한다.
#   예약이 밀려도 다음 실행이 그 자리를 덮으므로 데이터가 새지 않는다 —
#   수집은 언제나 목록 맨 앞부터 보고, 집계 창은 24시간이라 사이클을 건너뛰어도 겹친다.
#
#   30분마다 시작해 **27분 동안** 5분 간격으로 돈다(사이클 6회). 다음 예약이
#   기다리지 않도록 3분을 비워 둔다 (`concurrency` 가 취소가 아니라 대기이므로).
#
# ── 왜 요청이 늘지 않는가 (CLAUDE.md 3-A 5번)
#   주기를 6배로 당기면서 **요청은 오히려 줄었다.** 두 가지를 고쳤다.
#
#   1. `--adaptive` — 클랜별 활동량으로 티어를 나눠 **볼 차례인 클랜만** 훑는다
#      (`apps/worker/src/lib/supplyPollingPolicy.ts`). 190개 전부가 아니라 평균 27개다.
#   2. 클랜의 원본 `league_clan` id 를 **DB 에서 읽는다.** 예전에는 사이클마다
#      `/clans/{slug}/show` 를 190건 보냈다. 우리가 이미 아는 값이다 (3-A 3번).
#
#   실측(로컬 DB · 최근 14일 · 등록 클랜 190 · 경기 2,209건으로 5분 사이클 4,032회 시뮬레이션):
#
#                              지금(30분)      새 설계(5분)
#     클랜 경기목록 요청/시간      380              328
#     클랜 show 요청/시간          380                0
#     클랜랭킹 페이지/시간          28              168
#     경기 상세/시간                 7                7
#     ─────────────────────────────────────────────────
#     **합계 요청/시간**           795              502     ← 37% 감소
#
#   `docs/DECISIONS.md` D-168 에 계산 근거가 있다.
#   원본에 대한 예의로 동시 요청 3 · 간격 250ms 는 그대로 둔다.
#
# ── 조용한 클랜을 놓치지 않는 보장
#   티어는 굶기지 않는다. 어떤 클랜이든 자기 주기마다 **정확히 한 번** 차례가 오고,
#   가장 낮은 `dormant` 도 **24시간에 한 번은 반드시** 훑는다 (실측 최장 미조회 24.0시간).
#   상한(`SUPPLY_POLL_MAX_CLANS`)에 걸려 미뤄져도 다음 차례에 다시 온다.
#   새로 등록된 클랜은 차례를 기다리지 않고 그 사이클에 바로 훑는다 (D-168).

name: 3rd.supply 증분 동기화

on:
  schedule:
    # UTC 기준. 매시 정각·30분에 시작해 **한 실행 안에서 5분 간격으로 6회** 돈다
    - cron: '0,30 * * * *'
  workflow_dispatch:
    inputs:
      leagues:
        description: '동기화할 리그 slug (쉼표)'
        required: false
        default: 'supply,daerule,sanply'
      dry_run:
        description: '요청도 쓰기도 하지 않고 현황만 본다'
        type: boolean
        required: false
        default: false
      cycles:
        description: '이 실행에서 돌 사이클 수 (기본 6 · 5분 간격)'
        required: false
        default: '6'
      no_adaptive:
        description: '적응형 폴링을 끄고 등록 클랜 전부를 훑는다 (진단용 · 요청이 7배)'
        type: boolean
        required: false
        default: false

# 겹치면 **취소가 아니라 대기**한다.
# 적재·집계가 도는 중에 같은 것을 또 시작하면 같은 행을 두 곳에서 건드린다.
# 진행 중인 쪽을 죽이면 절반만 적재된 상태로 끝나므로 `cancel-in-progress` 는 false 다.
#
# 하루 1회 전수 집계(`supply-rollup-full.yml`)도 **같은 그룹**을 쓴다.
# 두 워크플로가 같은 `LeaguePlayer` 행을 쓰므로 절대 동시에 돌면 안 된다.
concurrency:
  group: supply-pipeline
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  sync:
    name: 5분 사이클 × N — 수집 → 적재 → 증분 집계 → 검증
    runs-on: ubuntu-latest
    # 사이클 예산(27분)에 준비·검증을 더한 값보다 넉넉하게. 무한정 붙잡지는 않는다
    timeout-minutes: 40

    env:
      # 운영 DB. **값을 로그에 찍지 않는다** (GitHub 이 자동 마스킹하지만 우리도 찍지 않는다)
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      # 점수의 주인은 **우리 공식**이다 (D-173).
      # 이게 없으면 이 잡이 30분마다 원본 점수로 되돌려 써서
      # 시즌0 랭킹이 30분 만에 사라진다. 승패·킬데스 같은 기록은 계속 갱신된다.
      SACLOUD_RATING_OWNER: formula
      # 원본 웹 클라이언트 공개 앱 헤더. 앱 버전이 올라가면 403 이 나므로 시크릿으로 갈아끼울 수 있게 둔다.
      # **비워 두면 코드의 기본값을 쓴다** — 빈 문자열을 헤더로 보내면 403 이다 (아래에서 unset 한다)
      SUPPLY_APP_ID: ${{ secrets.SUPPLY_APP_ID }}
      SUPPLY_APP_VER: ${{ secrets.SUPPLY_APP_VER }}
      # 원본에 대한 예의. 대량 수집 때(10 · 130ms)보다 훨씬 느리게 간다
      SUPPLY_CONCURRENCY: '3'
      SUPPLY_DELAY_MS: '250'
      # 적응형 폴링의 사이클 길이. **아래 CYCLE_SECONDS 와 같은 값이어야 한다** —
      # 티어별 주기를 사이클 수로 환산하는 기준이라 어긋나면 조회 빈도가 통째로 틀어진다
      SUPPLY_POLL_CYCLE_MINUTES: '5'
      LEAGUES: ${{ inputs.leagues || 'supply,daerule,sanply' }}
      DRY_RUN: ${{ inputs.dry_run || 'false' }}
      NO_ADAPTIVE: ${{ inputs.no_adaptive || 'false' }}
      # 사이클 수와 간격. 6 × 5분 = 25분 + 마지막 사이클 작업시간 ≈ 27분
      CYCLES: ${{ inputs.cycles || '6' }}
      CYCLE_SECONDS: '300'
      # 이 시간을 넘기면 다음 사이클을 시작하지 않는다 — 다음 예약을 막지 않으려는 것이다
      BUDGET_SECONDS: '1620'

    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v4

      - name: pnpm 설치
        # 버전은 package.json 의 `packageManager` 를 따른다 (pnpm@11.22.0)
        uses: pnpm/action-setup@v4

      - name: Node 24 설치
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'pnpm'

      - name: 의존성 설치
        run: pnpm install --frozen-lockfile

      - name: Prisma 클라이언트 생성
        run: pnpm --filter @sacloud/db exec prisma generate

      - name: 시크릿 확인 (값은 찍지 않는다)
        run: |
          set -euo pipefail
          if [ -z "${DATABASE_URL:-}" ]; then
            echo "::error::DATABASE_URL 시크릿이 없다. 리포지터리 Settings → Secrets 에 넣는다"
            exit 1
          fi
          echo "DATABASE_URL 설정됨"
          echo "리그: ${LEAGUES}"
          echo "사이클 ${CYCLES}회 × ${CYCLE_SECONDS}초 (예산 ${BUDGET_SECONDS}초)"
          echo "dry-run: ${DRY_RUN} · 적응형 끔: ${NO_ADAPTIVE}"
          echo "원본 속도: 동시 ${SUPPLY_CONCURRENCY} · 간격 ${SUPPLY_DELAY_MS}ms"

      - name: 5분 사이클 반복 — 수집 → 적재 → 증분 집계
        id: sync
        run: |
          set -uo pipefail

          # 시크릿을 안 넣었으면 **빈 문자열이 아니라 미설정**이어야 한다.
          # 빈 헤더를 보내면 원본이 403 을 준다 (apps/worker/src/lib/supplyClient.ts)
          if [ -z "${SUPPLY_APP_ID:-}" ]; then unset SUPPLY_APP_ID; fi
          if [ -z "${SUPPLY_APP_VER:-}" ]; then unset SUPPLY_APP_VER; fi

          worker() { pnpm --filter @sacloud/worker nexon "$@"; }

          adaptive_flag='--adaptive'
          if [ "$NO_ADAPTIVE" = 'true' ]; then adaptive_flag=''; fi

          started=$(date +%s)
          # 사이클 하나가 실패해도 **루프를 죽이지 않는다.**
          # 죽이면 남은 25분치 신선도를 통째로 버린다. 파이프라인은 idempotent 라
          # 다음 사이클이 같은 일을 다시 한다. 대신 실패를 세어 **마지막에 잡을 실패시킨다**
          failed=0
          total_new=0

          for cycle in $(seq 1 "$CYCLES"); do
            now=$(date +%s)
            elapsed=$(( now - started ))
            if [ "$cycle" -gt 1 ] && [ "$elapsed" -ge "$BUDGET_SECONDS" ]; then
              echo "예산 ${BUDGET_SECONDS}초를 넘겼다 (${elapsed}초) — 사이클 ${cycle} 부터는 다음 실행에 넘긴다"
              break
            fi

            cycle_started=$now
            echo "::group::사이클 ${cycle}/${CYCLES} (경과 ${elapsed}초)"

            for slug in $(echo "$LEAGUES" | tr ',' ' '); do
              if [ "$DRY_RUN" = 'true' ]; then
                # dry-run 은 **요청을 한 건도 보내지 않는다.** 체크포인트도 만들지 않으므로
                # 뒤의 적재·집계는 돌릴 것이 없다
                worker supply-mirror --league "$slug" --incremental --seen-from-db $adaptive_flag --dry-run || failed=$(( failed + 1 ))
                continue
              fi

              if ! worker supply-mirror --league "$slug" --incremental --seen-from-db $adaptive_flag; then
                echo "::warning::[$slug] 수집 실패 — 이번 사이클은 건너뛰고 다음에 다시 한다"
                failed=$(( failed + 1 ))
                continue
              fi

              # 이번에 새로 받은 것이 있나. `--seen-from-db` 덕분에 이 파일에는
              # **이번 실행에서 새로 받은 경기만** 들어 있다 (러너는 빈 작업공간에서 시작한다).
              # 한 실행 안에서 사이클을 여러 번 도므로 파일은 **누적**된다 —
              # 그래서 줄 수가 아니라 **직전 사이클 이후 늘어난 줄 수**를 본다
              details="packages/db/data/supply-mirror-${slug}.details.jsonl"
              if [ -f "$details" ]; then
                seen_now=$(wc -l < "$details" | tr -d ' ')
              else
                seen_now=0
              fi
              seen_file="${RUNNER_TEMP}/seen-${slug}"
              if [ -f "$seen_file" ]; then seen_before=$(cat "$seen_file"); else seen_before=0; fi
              new_count=$(( seen_now - seen_before ))
              echo "$seen_now" > "$seen_file"

              echo "[$slug] 새 경기 상세 ${new_count}건 (누적 ${seen_now})"
              total_new=$(( total_new + new_count ))

              if [ "$new_count" -le 0 ]; then
                echo "[$slug] 새 경기가 없다 — 적재·집계를 건너뛴다"
                continue
              fi

              # 네트워크를 쓰지 않는다. 이미 있는 경기는 건너뛴다 (idempotent · D-153)
              if ! worker supply-import --league "$slug" --confirm; then
                echo "::warning::[$slug] 적재 실패"
                failed=$(( failed + 1 ))
                continue
              fi

              # **증분** 집계다 (기본값). 방금 적재된 경기가 건드린 선수만 다시 만든다.
              # 전수와 값이 같다는 것은 `apps/worker/src/dev/rollupParity.ts` 로 대조했다 (D-168).
              # 클랜 점수·승패·부리그는 수집 파일 클랜 목록 값을 그대로 쓴다 (D-157).
              if ! worker supply-rollup --league "$slug" --confirm; then
                echo "::warning::[$slug] 집계 실패"
                failed=$(( failed + 1 ))
              fi
            done

            echo '::endgroup::'

            # 다음 사이클 시작까지 남은 시간만 잔다. 사이클 작업이 5분을 넘겼으면 곧바로 다음으로 간다
            if [ "$cycle" -lt "$CYCLES" ]; then
              spent=$(( $(date +%s) - cycle_started ))
              sleep_for=$(( CYCLE_SECONDS - spent ))
              if [ "$sleep_for" -gt 0 ]; then
                echo "다음 사이클까지 ${sleep_for}초 대기 (이번 사이클 ${spent}초)"
                sleep "$sleep_for"
              else
                echo "이번 사이클이 ${spent}초 걸렸다 — 대기 없이 다음으로 간다"
              fi
            fi
          done

          echo "총 새 경기 ${total_new}건 · 실패한 단계 ${failed}건"
          echo "failed=${failed}" >> "$GITHUB_OUTPUT"
          echo "total_new=${total_new}" >> "$GITHUB_OUTPUT"

      - name: 검증 — 행 수 · 무결성 (읽기만 한다)
        if: ${{ inputs.dry_run != true }}
        # 무결성 검사가 하나라도 깨지면 exit 1 → 잡이 실패한다
        run: pnpm --filter @sacloud/worker nexon db-snapshot --stamp "gha-${{ github.run_id }}"

      # IPL 클랜끼리의 경기가 열산에 새로 쌓였는가 (D-210).
      #
      # 막는 규칙은 `supply-import` 안에 있다. 이 단계는 **그 규칙이 샜는지** 보는 대조다.
      # 0 이 아니면 `nexon ipl-sanply-purge --confirm` 으로 치운다.
      #
      # ⚠ 지금은 **경고만** 한다 (`continue-on-error`). 운영에 아직 치우지 않은 잔여분이
      #   남아 있어서다. 운영을 한 번 치운 뒤에는 이 줄을 지워 **잡을 실패시킨다.**
      # 2026-08-31: 운영 잔여분(23건)을 치웠으므로 **경고에서 실패로 올렸다**.
      # 여기서 빨개지면 차단 규칙(D-210)이 새고 있다는 뜻이다 — 조용히 넘기지 마라.
      - name: 검증 — 열산에 IPL끼리의 경기가 남았는가 (D-210)
        if: ${{ inputs.dry_run != true }}
        run: pnpm --filter @sacloud/worker nexon ipl-sanply-check

      - name: 이번에 받은 원본 보관 (디버깅용 · 7일)
        if: ${{ always() && inputs.dry_run != true }}
        uses: actions/upload-artifact@v4
        with:
          name: supply-mirror-${{ github.run_id }}
          # 이번 실행에서 **새로 받은 것만** 들어 있다. 원본 응답 그대로다 (3-A 1번)
          path: |
            packages/db/data/supply-mirror-*.json
            packages/db/data/supply-mirror-*.jsonl
          if-no-files-found: ignore
          retention-days: 7

      - name: 사이클 실패가 있었으면 잡을 실패시킨다
        # 루프는 신선도를 지키려고 실패를 삼키고 계속 돌았다. **결과까지 삼키지는 않는다**
        if: ${{ always() && steps.sync.outputs.failed != '0' && steps.sync.outputs.failed != '' }}
        run: |
          echo "::error::사이클 중 ${{ steps.sync.outputs.failed }}건이 실패했다 — 로그의 ::warning:: 을 본다"
          exit 1
