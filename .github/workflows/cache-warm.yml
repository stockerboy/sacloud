# 엣지 캐시 워밍 (D-240)
#
# ── 무엇을 하는가
#   주요 공개 GET 경로를 **5분마다 한 번씩 그냥 부른다.** 그게 전부다.
#   응답을 검사하지도, 저장하지도 않는다. 부르는 행위 자체가 목적이다.
#
# ── 왜 필요한가
#   2026-09-01 에 엣지 캐시가 처음으로 실제로 걸렸다 (`apps/web/next.config.ts` 의 `headers()`).
#   실측으로 500(20초) 이던 것이 200(0.08초) 가 됐다. **다만 그건 캐시가 차 있을 때 얘기다.**
#
#   캐시가 비어 있으면 **그때 처음 들어온 사람**이 대신 값을 치른다 — 사이트와 수집 잡이
#   Supabase 한 대를 나눠 쓰는 지금(D-240 ②), 그 한 사람은 20초를 기다리거나 500 을 본다.
#   미리 누가 한 번 불러 두면 **그 한 사람이 없어진다.** 여기서 하는 일이 그것이다.
#
#   부수 효과로 서버리스 함수도 따뜻하게 유지된다. 식은 함수의 첫 요청이 10초였다.
#
# ── 왜 5분인가
#   캐시의 기본 등급이 `s-maxage=300`(5분) 이다. 주기가 그보다 길면 **중간에 반드시 비는
#   구간**이 생기고, 그 구간에 들어온 사람이 위의 «그 한 사람» 이 된다.
#   주기를 더 짧게 할 이유도 없다 — 캐시가 아직 살아 있는데 부르면 엣지가 답하고 끝이라
#   DB 에 닿지 않지만, 러너 시간만 쓴다.
#   1시간 등급(`/api/leagues` 등)은 5분마다 불러도 12번 중 11번은 엣지가 받는다. 손해가 없다.
#
#   ⚠ GitHub 의 예약 실행은 **정시성이 나쁘다.** `*/5` 로 적어도 실제 간격은 5분이 아니고,
#     부하가 몰리면 회차가 통째로 버려진다 (`supply-incremental.yml` 머리말과 같은 사정).
#     그래도 괜찮다 — 이건 **보장이 아니라 확률을 올리는 장치**다. 워밍이 밀려서 캐시가
#     비면 사이트는 워밍이 없던 때와 똑같이 동작할 뿐, 더 나빠지지 않는다.
#     그리고 `stale-while-revalidate=86400` 이 그 아래를 받친다.
#
# ── 왜 실패해도 초록인가
#   이건 **감시가 아니라 데우는 일**이다. 사이트가 잠깐 500 이든 배포 중이든, 다음 회차가
#   5분 뒤에 다시 온다. 여기서 빨간 X 를 쌓으면 **진짜 경보(수집 실패)가 그 속에 묻힌다.**
#   상태를 보는 것은 `/api/health` 의 몫이고, 이 워크플로의 몫이 아니다.
#
# ── 건드리지 않는 것
#   수집 워크플로(`supply-incremental.yml` · `supply-rollup-full.yml`)와는 아무 관계가 없다.
#   이 워크플로는 **읽기만** 한다. DB 에 쓰지 않고, 저장소에 쓰지 않고, 비밀값을 쓰지 않는다.

name: 엣지 캐시 워밍

on:
  schedule:
    # ── ⚠ **이제 예약은 후퇴값이다** (2026-09-03 · O-031)
    #
    #   `*/5` 로 적어 두면 하루 288회여야 한다. 실제로 온 것은 **9회**였다
    #   (09-02 하루 · 간격 4~5시간 · 마지막 성공 15:08). 나머지는 GitHub 이 버렸다.
    #   `supply-incremental.yml` 이 겪은 것과 같은 일이고(D-225 · 드롭 89%),
    #   **저쪽은 자기호출 체인으로 이미 해결했는데 여기만 안 붙어 있었다.**
    #   파일 머리말에 「예약은 정시성이 나쁘다」고 적어만 두고 장치를 안 달았다.
    #
    #   그래서 이제 신선도를 예약에 걸지 않는다. 잡이 끝나면서 자기를 다시 부른다.
    #   이 예약은 **체인이 끊겼을 때 되살리는 용도로만** 남긴다.
    #   `*/5` 는 그대로 둔다 — 어차피 대부분 버려지고, 체인이 살아 있으면
    #   아래 「최근 1시간 상한」이 겹치는 회차를 걸러 낸다.
    - cron: '*/5 * * * *'

  # 체인에 **시동**을 건다 (D-229 와 같은 이유).
  # 자기호출은 첫 한 번을 누가 시작해야 하는데, 그 첫 한 번이 바로 버려지는 예약이다.
  # 이 파일을 고쳐 밀면 한 번 돈다 — 그게 시동이고, 동시에 연기 시험이다.
  push:
    branches: [main]
    paths:
      - '.github/workflows/cache-warm.yml'

  workflow_dispatch:
    inputs:
      cycles:
        description: '이 실행에서 데울 횟수 (기본 6 · 5분 간격 = 약 30분)'
        required: false
        default: '6'
      top_players:
        description: '리그당 데울 랭킹 상위 선수 수 (기본 20 — 랭킹 한 쪽이 20명이다)'
        required: false
        default: '20'
      chain:
        description: '자기호출 체인 깊이. **사람은 건드리지 않는다** (폭주 방지용)'
        required: false
        default: '0'

# 앞 회차가 아직 돌고 있으면 이번 회차는 버린다.
# 워밍이 겹쳐서 좋을 일이 없고, 겹치면 그게 곧 부하다.
concurrency:
  group: cache-warm
  cancel-in-progress: false

permissions:
  contents: read
  # 잡이 끝나면서 자기 자신을 다시 부른다. dispatch 에 필요한 최소 권한이다.
  # `actions: write` 는 읽기도 포함한다 — 폭주 방지 검사가 `actions/runs` 를 읽는다
  actions: write

jobs:
  warm:
    runs-on: ubuntu-latest
    # 5 → 40 (2026-09-03 · O-031). **한 run 이 6번 데우고 끝난다** (5분 간격 = 약 30분).
    # 한 번 데우는 데는 1분이면 되지만, 예약이 안 오니 run 하나가 그 시간을 버텨야 한다.
    # 사이클 6 × 5분 = 30분 + 자기호출 여유. 무한정 붙잡지는 않는다.
    # 40 → 50 (O-034). 개인 경로가 목록에 붙어 한 바퀴가 길어졌다 — 안전판만 늘린다
    timeout-minutes: 50
    steps:
      - name: 잡 시작 시각을 기록한다
        run: echo "JOB_STARTED=$(date +%s)" >> "$GITHUB_ENV"

      - name: 공개 경로를 하나씩 부른다 (5분 간격 × N 사이클)
        continue-on-error: true
        env:
          # 저장소 변수(Settings → Variables)로 덮을 수 있다. 없으면 운영 주소를 쓴다.
          #
          # ── ★2026-09-03 (O-031) — 폴백이 vercel 주소였다★
          #   `https://sacloud-web-….vercel.app` 이었다. 저장소 변수가 안 잡혀 있으면
          #   **엉뚱한 호스트를 데우고 `3rdcloud.my` 는 계속 찬 채로 남는다.**
          #   엣지 캐시의 칸은 호스트마다 다르다 — 저쪽을 아무리 데워도 이쪽은 안 데워진다.
          #   사람이 실제로 오는 주소를 폴백으로 둔다.
          SITE_URL: ${{ vars.SITE_URL || 'https://3rdcloud.my' }}
          # ── 왜 한 run 안에서 반복하는가 (O-031)
          #   예약이 하루 288회 중 9회만 왔다. 그러면 run 하나가 **시간을 버텨야** 한다.
          #   `supply-incremental.yml` 의 「5분 사이클 × N」과 같은 모양이다.
          #   6 × 5분 = 약 30분. 그 뒤 자기호출이 다음 30분을 잇는다
          CYCLES: ${{ inputs.cycles || '6' }}
          # 리그당 상위 몇 명까지 데울 것인가 (O-034).
          #
          # ── 왜 20인가
          #   랭킹 API 가 **한 쪽에 20명**을 준다. `limit` 을 붙여도 20이다 (실측).
          #   그리고 그 20명이 **사람이 스크롤 없이 보는 그 20명**이다 — 임의로 고른 수가 아니다.
          #   더 데우려면 다음 쪽까지 긁어야 하고, 그건 「한 바퀴 시간」을 두 배로 만든다.
          #
          # **예산은 「한 바퀴 도는 시간」이다** — 아래에서 사이클이 실제 걸린 초를 찍는다.
          # 5분(300초) 안에 한 바퀴가 안 끝나면 이 값을 내려라
          TOP_PLAYERS: ${{ inputs.top_players || '20' }}
        run: |
          set -u

          # 쿼리스트링까지 **화면이 실제로 보내는 것과 똑같이** 적는다.
          # 엣지 캐시의 키는 전체 URL 이다 — `?weapon=all` 을 빼고 데우면
          # 화면이 쓰는 것과 **다른 칸**을 데우게 되어 아무 효과가 없다.
          # (`app/league/[leagueSlug]/rank/player/page.tsx` 는 `search: { weapon }` 을 항상 붙인다)
          PATHS="
          /api/remote_configs
          /api/leagues
          /api/home/top
          /api/boards?category=hot
          /api/leagues/nolink/ranks/overall?limit=1
          /api/leagues/supply
          /api/leagues/supply/ranks/clans?division=1
          /api/leagues/supply/ranks/players?weapon=all
          /api/leagues/supply/ranks/form?weapon=all
          /api/leagues/nolink
          /api/leagues/nolink/ranks/clans?division=1
          /api/leagues/nolink/ranks/players?weapon=all
          /api/leagues/sanply
          /api/leagues/sanply/ranks/clans?division=1
          /api/leagues/sanply/ranks/players?weapon=all
          "

          # ── ★랭킹 상위 선수를 목록에 태운다★ (2026-09-03 · O-034)
          #
          #   개인 경로(`/api/players/{id}`)는 캐시 키가 사람마다 다르다. 그래서
          #   「미리 데운다」가 통하지 않는 것처럼 보이는데, **절반은 통한다** —
          #   사람이 오는 이유 넷 중 「누가 잘하는지」·「어느 클랜이 1티어인지」는
          #   **랭킹에 있는 사람들**을 본다. 그건 **미리 알 수 있는 유한한 집합**이다.
          #
          #   ⚠ **「내 기록」은 못 덮는다.** 그건 여전히 첫 방문이다. 이건 죽는 걸 막는 게
          #     아니라 **죽는 규모를 줄이는 것**이다.
          #
          #   ⚠ **별도 목록표를 만들지 않는다.** 랭킹 응답에서 id 를 그대로 뽑아 쓴다 —
          #     표를 따로 두면 랭킹이 바뀔 때마다 그 표가 낡는다.
          #
          #   ⚠ 부르는 것은 **`/profile`** 이다 (O-034). 화면이 이제 그 하나만 부른다.
          #     옛 두 경로는 살아 있지만 아무도 안 부르는 것을 데울 이유가 없다.
          PLAYER_PATHS=""
          for lg in supply nolink sanply; do
            ids=$(curl -s --max-time 30 -H 'Accept: application/json' \
              "${SITE_URL}/api/leagues/${lg}/ranks/players?weapon=all" \
              | tr ',' '\n' | grep -o '"id":"[A-Za-z0-9-]*"' | cut -d'"' -f4 \
              | grep -E '^(OBS|SUP|NX)-' | head -n "${TOP_PLAYERS}" || true)
            for id in $ids; do
              PLAYER_PATHS="${PLAYER_PATHS}
          /api/players/${id}/profile"
            done
          done
          player_count=$(echo "$PLAYER_PATHS" | grep -c '/api/players/' || true)
          echo "상위 선수 ${player_count}명을 목록에 더한다 (리그당 ${TOP_PLAYERS}명 목표)"
          PATHS="${PATHS}${PLAYER_PATHS}"

          echo "대상: ${SITE_URL} · 사이클 ${CYCLES}회"

          cycle=1
          while [ "$cycle" -le "$CYCLES" ]; do
          cycle_started=$(date +%s)
          echo "── 사이클 ${cycle}/${CYCLES}  $(date -u +%H:%M:%SZ)"
          for p in $PATHS; do
            # `-o /dev/null` 응답 본문은 버린다. 우리는 값을 보러 온 게 아니다
            # `--max-time 45` 캐시가 비어 있으면 실제로 20초씩 걸린다. 그걸 기다려 주는 게 이 잡의 일이다
            # `|| true`      실패해도 다음 경로로 넘어간다 (위 「왜 실패해도 초록인가」)
            result=$(curl -s -o /dev/null \
              --max-time 45 \
              -w '%{http_code} %{time_total}s' \
              -H 'Accept: application/json' \
              -H 'User-Agent: sacloud-cache-warm' \
              "${SITE_URL}${p}" || echo 'FAIL -')
            # X-Vercel-Cache 를 같이 찍지 않는 이유: 그걸 보려면 헤더를 받아야 하고,
            # 그러면 이 잡이 «데우기» 가 아니라 «검사» 가 된다. 검사는 사람이 할 때 한다
            echo "  ${result}  ${p}"

            # 한꺼번에 때리면 그게 곧 부하다. 특히 캐시가 비어 있는 회차에는
            # 15개가 동시에 DB 로 내려가고, 접속 통로가 1개라 서로 줄을 선다 (D-240 ③)
            sleep 1
          done

          # ★한 바퀴가 실제로 몇 초 걸렸나★ — 이게 `TOP_PLAYERS` 의 예산 근거다 (O-034)
          spent=$(( $(date +%s) - cycle_started ))
          echo "── 사이클 ${cycle} 끝 · ${spent}초 걸렸다"

          # 마지막 사이클 뒤에는 안 쉰다 — 쉬어 봐야 자기호출만 늦어진다
          if [ "$cycle" -lt "$CYCLES" ]; then
            # 캐시 기본 등급이 `s-maxage=300`(5분) 이다. 그보다 길면 반드시 비는 구간이 생긴다.
            # **도는 데 쓴 시간을 빼고** 남은 만큼만 쉰다 — 목록이 길어져도 5분 박자를 지킨다
            rest=$(( 300 - spent ))
            if [ "$rest" -lt 30 ]; then
              echo "::warning::한 바퀴가 ${spent}초 걸렸다 — 5분 박자를 못 지킨다. TOP_PLAYERS 를 내려라"
              rest=30
            fi
            sleep "$rest"
          fi
          cycle=$(( cycle + 1 ))
          done

          # 어떤 경로가 실패했든 이 스텝은 항상 성공으로 끝난다
          exit 0

      # ── ★자기호출 체인★ (2026-09-03 · O-031)
      #
      #   `supply-incremental.yml` 의 것을 그대로 가져왔다. 새로 발명하지 않았다 —
      #   저쪽은 이미 실전에서 이 문제를 겪고 고쳤고, 우리는 같은 병을 앓고 있었다.
      #
      #   다른 점 둘
      #     · 같은 그룹을 쓰는 워크플로에 자리를 내주는 검사가 없다.
      #       이 잡은 **읽기만** 한다 — DB 에 쓰지 않으니 수집과 다툴 행이 없다
      #     · `MIN_ALIVE_SECONDS` 가 훨씬 짧다. 이 잡은 30분이 정상이고,
      #       수집처럼 한 시간을 도는 것이 아니다
      #
      #   ⚠ 실패해도 `exit 0` 이다. **이 잡은 감시가 아니라 데우는 일이다** —
      #     여기서 빨간 X 를 쌓으면 진짜 경보(수집 실패)가 그 속에 묻힌다.
      #     체인이 끊기면 `*/5` 예약 후퇴값이 되살린다.
      - name: 다음 실행을 스스로 예약한다 (self-dispatch)
        if: ${{ always() }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CHAIN: ${{ inputs.chain || '0' }}
          # 30분짜리 run 이니 40회면 20시간이다. 하루에 한 번쯤 새 체인이 열린다
          MAX_CHAIN: '40'
          # 정상은 시간당 2회(30분짜리)다. 예약 후퇴값이 몇 개 겹쳐도 4회를 넘지 않는다.
          # 5회부터는 폭주로 본다
          MAX_RUNS_PER_HOUR: '5'
          # 사이클 6회면 25분(1500초)은 산다. 그보다 훨씬 일찍 끝났으면
          # 뭔가 잘못된 것이고, 그 상태로 체인을 이으면 1분마다 도는 폭주가 된다
          MIN_ALIVE_SECONDS: '900'
        run: |
          set -uo pipefail
          next=$(( CHAIN + 1 ))

          alive=$(( $(date +%s) - JOB_STARTED ))
          if [ "$alive" -lt "$MIN_ALIVE_SECONDS" ]; then
            echo "::warning::이 run 이 ${alive}초만에 끝났다 — 체인을 잇지 않는다 (최소 ${MIN_ALIVE_SECONDS}초). 예약 후퇴값이 되살린다"
            exit 0
          fi

          if [ "$next" -gt "$MAX_CHAIN" ]; then
            echo "::warning::체인 깊이 ${CHAIN} 이 상한 ${MAX_CHAIN} 에 닿았다 — 여기서 끊는다. 예약이 새 체인을 연다"
            exit 0
          fi

          since=$(date -u -d '60 minutes ago' +%Y-%m-%dT%H:%M:%SZ)
          recent=$(curl -sS -H "Authorization: Bearer ${GH_TOKEN}" \
          -H 'Accept: application/vnd.github+json' \
          "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/cache-warm.yml/runs?per_page=100&created=%3E${since}" \
          | jq -r '.total_count // 0')
          if [ -z "$recent" ] || [ "$recent" = 'null' ]; then
            echo "::warning::최근 run 수를 못 읽었다 — 안전한 쪽으로 체인을 끊는다"
            exit 0
          fi
          if [ "$recent" -ge "$MAX_RUNS_PER_HOUR" ]; then
            echo "::warning::최근 1시간 run 이 ${recent}건이다 (상한 ${MAX_RUNS_PER_HOUR}) — 겹쳤거나 폭주다. 체인을 끊는다"
            exit 0
          fi

          echo "체인 ${CHAIN} → ${next} · 최근 1시간 ${recent}건 · 생존 ${alive}초 — 다음 실행을 부른다"
          code=$(curl -sS -o /tmp/dispatch.out -w '%{http_code}' -X POST \
          -H "Authorization: Bearer ${GH_TOKEN}" \
          -H 'Accept: application/vnd.github+json' \
          "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/cache-warm.yml/dispatches" \
          -d "{\"ref\":\"${GITHUB_REF_NAME}\",\"inputs\":{\"chain\":\"${next}\"}}")
          if [ "$code" = '204' ]; then
            echo "다음 실행을 예약했다 (체인 ${next})"
            exit 0
          fi

          # 여기서도 잡을 실패시키지 않는다 — 위 「왜 실패해도 초록인가」 그대로다.
          # 다만 **조용히 넘기지는 않는다.** 403 이면 토큰 권한이 모자란 것이다
          echo "::warning::self-dispatch 실패 HTTP ${code} — 체인이 끊겼다. 예약 후퇴값에 맡긴다. 403 이면 권한 문제다"
          echo "본문: $(head -c 300 /tmp/dispatch.out)"
          exit 0
