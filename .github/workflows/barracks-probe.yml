# 병영수첩 탐침 — GitHub 실행기의 「진짜 크롬」이 병영수첩을 여는가 (2026-09-02)
#
# ── 무엇을 하는가
#   ubuntu-latest 에서 크롬을 **두 번** 띄운다 — 한 번은 xvfb 아래 헤드풀, 한 번은 헤드리스.
#   각각 병영수첩(`barracks.sa.nexon.com`)에 아래 셋을 2초 간격으로 보내고
#   HTTP 상태 · 응답 크기 · 앞 200자를 로그에 찍는다. 실행기의 공인 IP 도 찍는다.
#
#     1. GET  /                                          첫 페이지
#     2. POST /api/ClanHome/GetClanMatchList/            { clan_id: "sorentolove" }
#     3. POST /api/BattleLog/GetBattleLogClan/260805205259124001/170430000194
#
#   결과는 `probe-result.json` 으로 artifact 에 올린다. 절차는 `scripts/barracks-probe.mjs`.
#
# ── 왜
#   IPL 기록은 병영수첩에서만 나오는데 Node 로 부르면 403, 진짜 크롬에서만 200 이다
#   (`docs/HANDOFF_2026-09-02_EVENING.md` 5장). 앞 세션이 **헤드리스는 403** 을 확인했다.
#   사장님 결정은 「돈 안 드는 방법만」. 후보 ① 이 실행기(무료) ② 사장님 PC.
#   ①이 되면 사람 손이 완전히 빠진다. 그런데 데이터센터 IP 라 막힐 수도 있다 —
#   **그건 돌려 봐야 안다. 추측하지 않는다.** 이 워크플로가 그 한 번의 시험이다.
#
# ── 읽는 법
#   로그의 `요약 [headful] home=… · clan-match-list=… · battle-log=…` 와
#   `요약 [headless] …` 두 줄이 답이다.
#     headful 200 / headless 403  → 화면이 있는 크롬이면 실행기에서도 된다 (VPS 없이 간다)
#     둘 다 403                   → IP 또는 자동화 자체가 막힌다 (② 사장님 PC 로)
#     둘 다 200                   → 헤드리스로도 된다 (더 싸게 간다)
#   **200 은 「길이 열려 있다」까지다.** 수집이 된다는 뜻은 아니다 — 그건 다음 시험이다.
#
# ── 하지 않는 것
#   · 저장하지 않는다. 창구(`/api/ingest/barracks`)로 보내지 않는다. 시크릿을 쓰지 않는다
#
# ── ★2026-09-03 · curl 갈래를 앞에 붙였다 (O-051)★
#   사장님: «★나는 크롬 못켜놓는다★ ★무조건 자동화 방안 알아봐 15분에 한번 갱신되는★»
#   → 「사장님 PC 에서 크롬을 띄운다」가 후보에서 빠졌다. ★기계가 알아서 도는 것만 남았다.★
#
#   ★싼 것부터 시험한다. 되는 순간 멈춘다★
#     1단계  ★curl★          크롬도 puppeteer 도 필요 없다
#     2단계  헤드리스 크롬
#     3단계  헤드풀(xvfb)
#
#   curl 은 ★자기 UA(curl/8.x) 그대로★ 보낸다. ★브라우저인 척하지 않는다★ —
#   403 이 나오면 그건 답이지 고칠 거리가 아니다 (CLAUDE.md 3-A 5번).
#
#   ⚠ ★예약은 결과를 한 번 받기 위한 임시다. 결과가 나오면 반드시 뺀다.★
#     저장소가 ★공개★ 라 Actions 분(minute)은 ★무료 무제한★ 이다
#     (실측 — GitHub API 가 visibility=public 을 준다).
#     그래서 한도가 아니라 ★원본을 두드리는 횟수★ 가 제약이다 → ★한 시간에 한 번★
#   · 예약(schedule)이 없다. **사람이 누를 때만** 돈다 — 원본에 반복해서 두드리지 않는다
#   · 저장소 의존성에 puppeteer 를 넣지 않는다 (`pnpm-lock.yaml` 을 건드리지 않는다).
#     실행기 임시 폴더에만 설치하고 `NODE_PATH` 로 알려 준다
#   · UA·쿠키 위조 · 탐지 회피 플래그를 넣지 않는다 (`CLAUDE.md` 3-A 5번).
#     `--no-sandbox` 하나는 실행기 사정이다 (Ubuntu 24.04 가 비특권 user namespace 를 막는다)

name: 병영수첩 탐침 (헤드풀 vs 헤드리스)

on:
  # ⚠ ★임시다.★ 한 번도 안 돌아서 결과가 없는데 이 세션은 버튼을 누를 수 없다.
  #   ★결과를 받으면 이 세 줄을 뺀다.★ 지금 도는 것과 안 겹치는 분을 골랐다
  #   (cache-warm */5 · watchdog 4-59/10 · season0 17분 · supply 7,37분)
  schedule:
    - cron: '21 * * * *'
  workflow_dispatch:
    inputs:
      puppeteer_version:
        description: 'puppeteer 고정 버전 (실행기에서만 설치한다)'
        required: false
        default: '25.9.0'

# 두 번 눌러도 한 번에 하나만 — 원본에 겹쳐서 두드리지 않는다
concurrency:
  group: barracks-probe
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  probe:
    name: 진짜 크롬으로 병영수첩 3건 · 헤드풀 → 헤드리스
    runs-on: ubuntu-latest
    # 크롬 내려받기(~1분) + 요청 6건(상한 30초씩) 이면 넉넉하다. 더 걸리면 뭔가 잘못된 것이다
    timeout-minutes: 15

    env:
      PUPPETEER_VERSION: ${{ inputs.puppeteer_version || '25.9.0' }}

    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v4

      # puppeteer 를 여기에만 설치한다. 저장소 작업공간이 아니다.
      # ⚠ job 수준 `env:` 에서는 `${{ runner.temp }}` 를 못 쓴다 (GitHub 가 워크플로 자체를 못 읽는다 —
      #   2026-09-02 실측 «Unrecognized named-value: 'runner'»). 그래서 스텝 안에서 셸 변수로 정한다
      - name: 설치 위치를 정한다 (실행기 임시 폴더)
        run: echo "PROBE_HOME=${RUNNER_TEMP}/barracks-probe" >> "$GITHUB_ENV"

      - name: Node 24 설치
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      # 데이터센터 IP 로 막히는지 판정하려면 **어느 IP 로 나갔는지**가 결과와 함께 있어야 한다
      - name: 실행기 공인 IP
        id: ip
        run: |
          set -u
          ip=$(curl -s --max-time 15 https://api.ipify.org || echo 'unknown')
          echo "공인 IP: ${ip}"
          echo "public_ip=${ip}" >> "$GITHUB_OUTPUT"

      # ── ★① curl. 제일 싼 갈래다★
      #   ★브라우저인 척하지 않는다★ — curl 자기 UA 그대로, 쿠키 없이, 회피 플래그 없이.
      #   200 이 나오면 ★크롬도 puppeteer 도 필요 없다.★
      - name: curl — 3건 (제일 싼 갈래)
        id: curl
        continue-on-error: true
        run: |
          set -u
          O=https://barracks.sa.nexon.com
          out="${RUNNER_TEMP}/probe-curl.json"
          : > "${RUNNER_TEMP}/curl-rows.ndjson"
          # $1 이름 · $2 방법 · $3 경로 · $4 본문(없으면 빈 문자열)
          hit() {
            f="${RUNNER_TEMP}/curl-$1.out"
            if [ -n "$4" ]; then
              m=$(curl -sS -o "$f" -w '%{http_code} %{size_download} %{time_total}' \
                    --max-time 30 -X "$2" -H 'Content-Type: application/json' \
                    --data "$4" "${O}$3" || echo 'ERR 0 0')
            else
              m=$(curl -sS -o "$f" -w '%{http_code} %{size_download} %{time_total}' \
                    --max-time 30 "${O}$3" || echo 'ERR 0 0')
            fi
            code=$(echo "$m" | cut -d' ' -f1)
            size=$(echo "$m" | cut -d' ' -f2)
            secs=$(echo "$m" | cut -d' ' -f3)
            head=$(head -c 200 "$f" 2>/dev/null | tr -d '\000' | tr '\n' ' ')
            echo "  [curl] $1 -> HTTP ${code} · ${size} bytes · ${secs}s"
            echo "         ${head}"
            jq -nc --arg id "$1" --arg mm "$2" --arg u "${O}$3" \
              --arg s "$code" --arg b "$size" --arg t "$secs" --arg h "$head" \
              '{id:$id,method:$mm,url:$u,status:($s|tonumber? // null),bytes:($b|tonumber? // null),ms:(($t|tonumber? // 0)*1000|floor),head:$h}' \
              >> "${RUNNER_TEMP}/curl-rows.ndjson"
            sleep 2
          }
          hit home GET '/' ''
          hit clan-match-list POST '/api/ClanHome/GetClanMatchList/' '{"clan_id":"sorentolove"}'
          # ⚠ ★본문이 없으면 405 다★ — 빈 JSON 이라도 있어야 200 이 온다 (2026-09-03 실측)
          hit battle-log POST '/api/BattleLog/GetBattleLogClan/260805205259124001/170430000194' '{}'
          jq -s '{mode:"curl",requests:.}' "${RUNNER_TEMP}/curl-rows.ndjson" > "$out"
          jq -r '.requests | map("\(.id)=\(.status // "ERR")") | join(" · ")' "$out"

      # 헤드풀 크롬은 화면이 있어야 뜬다. 실행기에는 화면이 없으니 가상 화면을 깐다
      - name: xvfb 설치 (가상 화면)
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb > /dev/null
          command -v xvfb-run
          echo "xvfb 준비됨"

      - name: puppeteer 를 임시 폴더에만 설치한다 (저장소 의존성 아님)
        run: |
          set -euo pipefail
          mkdir -p "${PROBE_HOME}"
          cd "${PROBE_HOME}"
          # 빈 package.json 위에 설치한다. 저장소의 lockfile 은 건드리지 않는다
          npm init -y > /dev/null
          npm install --no-audit --no-fund --silent "puppeteer@${PUPPETEER_VERSION}"
          echo "puppeteer ${PUPPETEER_VERSION} → ${PROBE_HOME}/node_modules"
          # postinstall 이 Chrome for Testing 을 받아 둔다 (~/.cache/puppeteer). 그것이 예비다
          ls "${PROBE_HOME}/node_modules/puppeteer/package.json" > /dev/null

      # 실행기에 이미 있는 크롬을 먼저 쓴다 — puppeteer 가 받는 「Chrome for Testing」보다
      # 사람이 쓰는 크롬에 가깝다. 못 띄우면 스크립트가 내장 크롬으로 알아서 넘어간다
      - name: 실행기의 크롬 위치
        id: chrome
        run: |
          set -u
          path=$(command -v google-chrome || command -v google-chrome-stable || command -v chromium-browser || true)
          if [ -n "$path" ]; then
            echo "크롬: ${path} — $("$path" --version 2>/dev/null || echo '버전 확인 실패')"
          else
            echo "실행기에 크롬이 없다 — puppeteer 가 받은 것을 쓴다"
          fi
          echo "path=${path}" >> "$GITHUB_OUTPUT"

      - name: 절차 확인 (dry-run · 요청을 보내지 않는다)
        env:
          NODE_PATH: ${{ env.PROBE_HOME }}/node_modules
          PROBE_CHROME_PATH: ${{ steps.chrome.outputs.path }}
          PROBE_PUBLIC_IP: ${{ steps.ip.outputs.public_ip }}
        run: node scripts/barracks-probe.mjs --dry-run

      # ── ① 헤드풀. 가상 화면 위에 진짜 창을 띄운다. 이것이 본 시험이다
      - name: 헤드풀 크롬 (xvfb) — 3건
        id: headful
        # 403 은 결과이지 실패가 아니다. 스크립트는 요청을 아예 못 보냈을 때만 exit 1 이다.
        # 그래도 헤드리스 비교까지는 돌려야 하므로 여기서 멈추지 않는다
        continue-on-error: true
        env:
          NODE_PATH: ${{ env.PROBE_HOME }}/node_modules
          PROBE_CHROME_PATH: ${{ steps.chrome.outputs.path }}
          PROBE_PUBLIC_IP: ${{ steps.ip.outputs.public_ip }}
        run: |
          set -u
          xvfb-run -a --server-args='-screen 0 1280x900x24' \
            node scripts/barracks-probe.mjs --mode headful --out "${RUNNER_TEMP}/probe-headful.json"

      # 두 번 띄우는 사이에도 원본에 숨 돌릴 틈을 준다
      - name: 2초 쉰다
        run: sleep 2

      # ── ② 헤드리스. 같은 실행기 · 같은 IP · 같은 세 요청. 둘의 차이가 답이다
      - name: 헤드리스 크롬 — 3건 (비교용)
        id: headless
        continue-on-error: true
        env:
          NODE_PATH: ${{ env.PROBE_HOME }}/node_modules
          PROBE_CHROME_PATH: ${{ steps.chrome.outputs.path }}
          PROBE_PUBLIC_IP: ${{ steps.ip.outputs.public_ip }}
        run: node scripts/barracks-probe.mjs --mode headless --out "${RUNNER_TEMP}/probe-headless.json"

      - name: 결과를 하나로 묶고 요약을 찍는다
        if: ${{ always() }}
        env:
          PUBLIC_IP: ${{ steps.ip.outputs.public_ip }}
        run: |
          set -u
          hf="${RUNNER_TEMP}/probe-headful.json"
          hl="${RUNNER_TEMP}/probe-headless.json"
          cu="${RUNNER_TEMP}/probe-curl.json"
          [ -f "$cu" ] || echo '{"fatal":"curl 결과 파일이 없다 — 스텝이 시작조차 못 했다","requests":[]}' > "$cu"
          [ -f "$hf" ] || echo '{"fatal":"헤드풀 결과 파일이 없다 — 스크립트가 시작조차 못 했다","requests":[]}' > "$hf"
          [ -f "$hl" ] || echo '{"fatal":"헤드리스 결과 파일이 없다 — 스크립트가 시작조차 못 했다","requests":[]}' > "$hl"

          jq -n \
            --arg ip "$PUBLIC_IP" \
            --arg run "${GITHUB_RUN_ID}" \
            --slurpfile cu "$cu" \
            --slurpfile hf "$hf" \
            --slurpfile hl "$hl" \
            '{ publicIp: $ip, runId: $run, generatedAt: (now | todate), curl: $cu[0], headful: $hf[0], headless: $hl[0] }' \
            > probe-result.json

          line() {
            jq -r --arg m "$1" '.[$m].requests | map("\(.id)=\(.status // "ERR")") | join(" · ")' probe-result.json
          }
          {
            echo "## 병영수첩 탐침"
            echo
            echo "- 공인 IP: \`${PUBLIC_IP}\`"
            echo "- ★curl:   \`$(line curl)\`★  <- 200 이면 여기서 끝난다"
            echo "- 헤드풀:   \`$(line headful)\`"
            echo "- 헤드리스: \`$(line headless)\`"
            echo
            echo "| 모드 | 요청 | HTTP | bytes | ms | 앞 200자 |"
            echo "|---|---|---|---|---|---|"
            jq -r '
              ["curl","headful","headless"][] as $m
              | .[$m].requests[]
              | "| \($m) | \(.id) | \(.status // "ERR") | \(.bytes // "-") | \(.ms // "-") | \((.head // .error // "") | gsub("\\|"; "\\|") | .[0:120]) |"
            ' probe-result.json
          } | tee -a "$GITHUB_STEP_SUMMARY"

      - name: 결과 artifact (probe-result.json · 14일)
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: barracks-probe-${{ github.run_id }}
          path: probe-result.json
          if-no-files-found: warn
          retention-days: 14
