# 3rd.supply 리그 집계 — **전수 재계산** (하루 1회 정합성 보정 · D-168)
#
# ── 왜 따로 있는가
#   평소 집계는 5분마다 도는 증분이다 (`supply-incremental.yml`). 새로 적재된 경기가
#   건드린 선수만 **처음부터 다시** 만든다 — 누적이 아니라 재계산이라 두 번 돌려도 값이 같다.
#
#   그래도 전수 경로를 없애지 않는다. 증분이 못 보는 경우가 있다.
#     · 경기가 **적재 없이** 바뀐 경우 (수동 교정 · 다른 잡의 백필)
#     · `ingestedAt` 이 없거나 뒤로 밀린 행
#     · 증분 창(24시간)보다 오래 실패가 이어진 경우
#   그럴 때 값이 조용히 낡는다. 하루 한 번 전부 다시 계산해 **되돌려 놓는다.**
#
#   증분 결과와 전수 결과가 같다는 것은 대조로 확인했다 —
#   `apps/worker/src/dev/rollupParity.ts` (전수 → 값 훼손 → 증분 → 체크섬 일치).
#   실측(로컬): supply 전수 121.4초 / 증분 15.4초 · daerule 45.8초 / 7.5초.
#
# ── 언제 도는가
#   19:00 UTC = 04:00 KST. 원본 활동이 가장 적은 시간대다.
#   ⚠ ★여기 「네트워크를 쓰지 않는다 — 원본에 요청이 0건이다」라고 적혀 있었다. 틀렸다★
#     (2026-09-03 · O-042 중 발견). 이 파일은 아래에서 `supply-mirror` 를 **실제로 부른다**
#     (「클랜 목록 + 새 경기」 스텝). 그 스텝 주석은 «요청은 리그당 수십 건이다» 라고
#     제대로 적고 있다 — ★머리말과 본문이 서로 반대말을 하고 있었다.★
#     **전수 재계산 자체는** DB 안에서만 돈다. 그러나 이 워크플로는 그 앞에 수집을 한 번 한다.
#     ★그래서 이 파일도 「수집하는 곳」이다.★ O-042 로 여기서도 daerule 을 뺐다.
#
# ── 증분과 절대 겹치면 안 된다
#   둘 다 같은 `LeaguePlayer` · `LeagueClan` 행을 쓴다. 그래서 `concurrency` 그룹을
#   `supply-incremental.yml` 과 **같은 이름**으로 둔다. 겹치면 취소가 아니라 대기다.

name: 3rd.supply 전수 집계 (정합성 보정)

on:
  # ── ⛔ 2026-09-01 밤 · 자동 실행을 껐다 ────────────────────────────────
  #
  #   왜 — 이 전수 집계는 `LeaguePlayer.win/lose/kill/death` 를 **전체기간** 값으로
  #   다시 만든다. 그런데 사용자가 래더를 **7/1 이후 기준**으로 전수 재계산하라고
  #   정했다(`season0Apply`). 새벽 4시에 이게 돌면 그 결과가 통째로 덮인다.
  #   같은 이유로 `supply-incremental.yml` 의 증분 집계도 껐다.
  #
  #   **수동 실행(`workflow_dispatch`)은 남겨 뒀다.** 필요하면 손으로 돌릴 수 있다.
  #
  #   되살리려면 — 아래 세 줄의 주석을 풀면 된다. 다만 그 전에
  #   `supplyRollup.ts` 가 7/1 창을 존중하게 고쳐야 한다. 안 그러면 또 덮는다.
  #
  # ── ✅ **2026-09-02 · 다시 켰다** (D-258) ──────────────────────────────
  #
  #   위 주석은 지우지 않는다 (CLAUDE.md 10-4). 다만 **전제가 바뀌었다** —
  #   이 집계는 이제 `LeaguePlayer.win/lose/kill/death` 를 **쓰지 않는다.**
  #   `SACLOUD_RATING_OWNER=formula`(아래 env 에 이미 있다)가 집계 칸을 전부 막고,
  #   남는 것은 **명부**뿐이다 — 현재 소속 클랜(D-160) · 부리그 · 클랜/리그클랜 행 생성 ·
  #   원본 `league_clan` id 채우기 (3-A 3번).
  #
  #   그 칸들은 `season0Apply` 가 한 줄도 안 쓴다. 그러니 **덮을 것이 없다.**
  #   자세한 것은 `packages/db/ops/supplyRollup.ts` 의 `ratingOwnedByFormula` 머리말.
  #
  #   ⚠ 「7/1 창을 존중하게 고친다」는 위 주석의 예고는 **실행하지 않았다.**
  #     고쳐도 답이 맞지 않는다는 것을 실측으로 확인했다 (D-258). 그 길로 가지 마라.
  schedule:
    # UTC 19:00 = KST 04:00. 증분 cron 이 이 시간을 비워 두고 있다 (D-224)
    - cron: '0 19 * * *'
  workflow_dispatch:
    inputs:
      leagues:
        description: '집계할 리그 slug (쉼표)'
        required: false
        # 2026-09-03 (O-042) — daerule 을 뺐다. 옛값 'supply,daerule,sanply'
        default: 'supply,sanply'
      dry_run:
        description: '미리보기 — 한 줄도 쓰지 않는다'
        type: boolean
        required: false
        default: false

concurrency:
  group: supply-pipeline
  cancel-in-progress: false

permissions:
  contents: read
  # 끝나면서 **증분 체인을 다시 열어 준다** (D-229). dispatch 에 필요한 최소 권한이다
  actions: write

jobs:
  # ── 왜 리그마다 잡을 나누는가 (2026-09-01 · D-225)
  #
  #   실측: 이 워크플로의 run 3건이 **전부 90분 타임아웃에 죽었다.**
  #   `jobs` API 로 스텝을 열어 보면 셋 다 「전수 재계산」에서 84.3 / 87.1 / 88.0분을
  #   돌다 잘렸다. **밀려서 취소된 것이 아니다** — D-224 는 이것을 concurrency 대기 취소로
  #   읽었는데 그건 틀렸다. 대기 시간은 2건이 0분, 1건이 7.2분이었다.
  #
  #   한 잡 안에서 세 리그를 이어 돌면 **90분을 셋이 나눠 쓴다.** 그래서 마지막 리그는
  #   시작조차 못 했고, 앞 리그가 끝냈어도 잡이 실패로 끝나니 무엇이 됐는지 알 수 없었다.
  #   리그마다 잡을 나누면 ① 각자 자기 시간을 온전히 쓰고 ② 하나가 죽어도 나머지는 살고
  #   ③ 어느 리그가 느린지 run 화면에서 바로 보인다.
  #
  #   준비 비용(체크아웃·install·prisma generate)은 **실측 24초**다 (증분 run 16건 평균).
  #   잡을 셋으로 늘려도 1분 남짓이라 나누는 편이 싸다.
  #
  # ── 동시에 돌리지 않는다
  #   `max-parallel: 1`. 세 리그가 같은 운영 DB 를 때리는 것을 막고, 점유 시간이
  #   예측 가능해진다. `fail-fast: false` — 하나가 죽어도 나머지를 돌린다.
  prepare:
    name: 대상 리그 정하기
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      leagues: ${{ steps.pick.outputs.leagues }}
      started: ${{ steps.pick.outputs.started }}
    steps:
      - name: 리그 목록을 JSON 배열로 만든다
        id: pick
        env:
          # 2026-09-03 (O-042) — daerule 을 뺐다. 옛값 'supply,daerule,sanply'
          LEAGUES: ${{ inputs.leagues || 'supply,sanply' }}
        run: |
          set -euo pipefail
          json=$(for slug in $(echo "$LEAGUES" | tr ',' ' '); do echo "$slug"; done | jq -R . | jq -sc .)
          echo "leagues=${json}" >> "$GITHUB_OUTPUT"
          # 전체 예산의 기준점. 리그마다 여기서 얼마나 지났는지 재서 폭주를 막는다
          echo "started=$(date +%s)" >> "$GITHUB_OUTPUT"
          echo "대상 리그 ${json}"

  rollup:
    name: 전수 재계산 — ${{ matrix.league }}
    needs: prepare
    runs-on: ubuntu-latest
    # 90 → 100 **리그당** (D-225). 셋이 나눠 쓰던 90분을 각자 온전히 쓴다.
    # 실측으로 88분을 넘긴 적이 있으니 90 은 여유가 없다.
    timeout-minutes: 100
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        league: ${{ fromJson(needs.prepare.outputs.leagues) }}

    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      # 전수 집계도 **긴 배치 잡**이다. 증분과 같은 이유로 세션 풀러(5432)를 쓴다 —
      # 6543 의 자리는 사이트 몫으로 남긴다 (D-249 후속 · `packages/db` 의 `sessionPoolerUrl`)
      SACLOUD_DB_SESSION_POOLER: '1'
      # 점수의 주인은 우리 공식이다 (D-173) — 원본 점수로 되돌려 쓰지 않는다
      SACLOUD_RATING_OWNER: formula
      LEAGUE: ${{ matrix.league }}
      DRY_RUN: ${{ inputs.dry_run || 'false' }}
      # 워크플로 전체 예산(분). 이걸 넘기면 남은 리그를 **건너뛰고 크게 알린다** —
      # 증분과 같은 `concurrency` 그룹이라 오래 잡고 있으면 신선도가 그만큼 밀린다
      TOTAL_BUDGET_MINUTES: '210'
      STARTED_AT: ${{ needs.prepare.outputs.started }}

    steps:
      - name: 전체 예산이 남았는가
        id: budget
        run: |
          set -euo pipefail
          elapsed=$(( ( $(date +%s) - STARTED_AT ) / 60 ))
          echo "워크플로 경과 ${elapsed}분 / 예산 ${TOTAL_BUDGET_MINUTES}분"
          if [ "$elapsed" -ge "$TOTAL_BUDGET_MINUTES" ]; then
            # 조용히 줄이지 않는다 — 무엇을 건너뛰었는지 로그에 남긴다
            echo "::error::[${LEAGUE}] 전체 예산 ${TOTAL_BUDGET_MINUTES}분을 넘겨(${elapsed}분) **집계하지 않고 건너뛴다.** 이 리그의 값은 오늘 보정되지 않았다"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: 저장소 체크아웃
        if: ${{ steps.budget.outputs.skip == 'false' }}
        uses: actions/checkout@v4

      - name: pnpm 설치
        if: ${{ steps.budget.outputs.skip == 'false' }}
        uses: pnpm/action-setup@v4

      - name: Node 24 설치
        if: ${{ steps.budget.outputs.skip == 'false' }}
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'pnpm'

      - name: 의존성 설치
        if: ${{ steps.budget.outputs.skip == 'false' }}
        run: pnpm install --frozen-lockfile

      - name: Prisma 클라이언트 생성
        if: ${{ steps.budget.outputs.skip == 'false' }}
        run: pnpm --filter @sacloud/db exec prisma generate

      - name: 시크릿 확인 (값은 찍지 않는다)
        if: ${{ steps.budget.outputs.skip == 'false' }}
        run: |
          set -euo pipefail
          if [ -z "${DATABASE_URL:-}" ]; then
            echo "::error::DATABASE_URL 시크릿이 없다"
            exit 1
          fi
          echo "DATABASE_URL 설정됨 · 리그 ${LEAGUE} · dry-run ${DRY_RUN}"

      - name: 클랜 목록 받아 두기 — 집계가 클랜을 건너뛰지 않게
        if: ${{ steps.budget.outputs.skip == 'false' && inputs.dry_run != true }}
        # 클랜 점수·승패·부리그의 출처는 **수집 파일 클랜 목록** 하나뿐이다 (D-157).
        # 러너는 빈 작업공간이라 그 파일이 없고, 없으면 집계가 클랜을 통째로 건너뛴다
        # (값을 지어내지 않기 위해서다) — 그 상태로는 이 잡이 exit 1 로 끝난다.
        #
        # 그래서 증분 사이클을 **한 번** 돌려 체크포인트를 만든다. 평소 사이클과 같은 명령이라
        # 새 경기가 있으면 그것도 같이 받아 둔다. 요청은 리그당 수십 건이다.
        env:
          SUPPLY_APP_ID: ${{ secrets.SUPPLY_APP_ID }}
          SUPPLY_APP_VER: ${{ secrets.SUPPLY_APP_VER }}
          SUPPLY_CONCURRENCY: '3'
          SUPPLY_DELAY_MS: '250'
          SUPPLY_POLL_CYCLE_MINUTES: '5'
        run: |
          set -uo pipefail
          if [ -z "${SUPPLY_APP_ID:-}" ]; then unset SUPPLY_APP_ID; fi
          if [ -z "${SUPPLY_APP_VER:-}" ]; then unset SUPPLY_APP_VER; fi
          echo "::group::[${LEAGUE}] 클랜 목록 + 새 경기"
          pnpm --filter @sacloud/worker nexon supply-mirror \
          --league "$LEAGUE" --incremental --seen-from-db --adaptive || \
          echo "::warning::[${LEAGUE}] 수집 실패 — 클랜은 건너뛴 채 선수만 집계된다"
          echo '::endgroup::'

      - name: 새로 받은 경기 적재 (있으면)
        if: ${{ steps.budget.outputs.skip == 'false' && inputs.dry_run != true }}
        run: |
          set -uo pipefail
          details="packages/db/data/supply-mirror-${LEAGUE}.details.jsonl"
          if [ ! -s "$details" ]; then
            echo "[${LEAGUE}] 새 경기 없음 — 적재 건너뜀"
            exit 0
          fi
          pnpm --filter @sacloud/worker nexon supply-import --league "$LEAGUE" --confirm || \
          echo "::warning::[${LEAGUE}] 적재 실패"

      - name: 전수 재계산
        if: ${{ steps.budget.outputs.skip == 'false' }}
        run: |
          set -uo pipefail
          confirm='--confirm'
          if [ "$DRY_RUN" = 'true' ]; then confirm=''; fi

          started=$(date +%s)
          # `--full` 이 전수다. 붙이지 않으면 기본이 증분이라 보정이 되지 않는다
          if ! pnpm --filter @sacloud/worker nexon supply-rollup --league "$LEAGUE" --full $confirm; then
            echo "::error::[${LEAGUE}] 전수 집계 실패 ($(( ( $(date +%s) - started ) / 60 ))분)"
            exit 1
          fi
          # 다음에 timeout 을 정할 근거가 된다. 실측 없이 값을 고르지 않기 위해 남긴다
          echo "[${LEAGUE}] 전수 집계 완료 — $(( ( $(date +%s) - started ) / 60 ))분"

  verify:
    name: 검증 — 행 수 · 무결성
    needs: [prepare, rollup]
    # 앞이 죽어도 따로 돈다. **검사 스텝은 서로를 가리면 안 된다** (D-224)
    if: ${{ always() && inputs.dry_run != true }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      # 전수 집계도 **긴 배치 잡**이다. 증분과 같은 이유로 세션 풀러(5432)를 쓴다 —
      # 6543 의 자리는 사이트 몫으로 남긴다 (D-249 후속 · `packages/db` 의 `sessionPoolerUrl`)
      SACLOUD_DB_SESSION_POOLER: '1'
    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v4

      - name: pnpm 설치
        uses: pnpm/action-setup@v4

      - name: Node 24 설치
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'pnpm'

      - name: 의존성 설치
        run: pnpm install --frozen-lockfile

      - name: Prisma 클라이언트 생성
        run: pnpm --filter @sacloud/db exec prisma generate

      - name: 검증 — 행 수 · 무결성 (읽기만 한다)
        run: pnpm --filter @sacloud/worker nexon db-snapshot --stamp "full-${{ github.run_id }}"

      # ── 증분 체인을 **다시 열어 준다** (D-229)
      #
      #   증분은 자기호출로 도는데, 전수 집계가 자리를 기다리는 동안에는 물러나 있는다
      #   (대기 자리가 하나뿐이라 밀고 들어가면 전수 집계가 취소된다).
      #   물러난 체인을 누가 다시 여는가 — **끝낸 쪽이 연다.** 그것이 여기다.
      #
      #   이걸 예약(cron)에 맡기면 안 된다. 실측 전달률이 11% 라 몇 시간이 빈다.
      #   실제로 첫 실전에서 그렇게 끊겼다.
      #
      #   `always()` — 집계가 실패해도 증분은 다시 돌아야 한다. 둘은 다른 일이다.
      #   이미 도는 증분이 있으면 부르지 않는다(중복 방지). 실패해도 잡을 죽이지 않는다 —
      #   여기서 빨개지면 「집계가 실패했다」로 잘못 읽힌다. 대신 `::warning::` 을 남긴다.
      - name: 증분 체인을 다시 연다 (self-dispatch · D-229)
        if: ${{ always() }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -uo pipefail
          live=$(curl -sS -H "Authorization: Bearer ${GH_TOKEN}" \
          -H 'Accept: application/vnd.github+json' \
          "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/supply-incremental.yml/runs?per_page=10" \
          | jq -r '[.workflow_runs[] | select(.status=="queued" or .status=="in_progress" or .status=="waiting" or .status=="pending")] | length')
          if [ -n "$live" ] && [ "$live" != 'null' ] && [ "$live" -gt 0 ]; then
            echo "증분이 이미 ${live}건 돌고 있다 — 부르지 않는다"
            exit 0
          fi

          code=$(curl -sS -o /tmp/redispatch.out -w '%{http_code}' -X POST \
          -H "Authorization: Bearer ${GH_TOKEN}" \
          -H 'Accept: application/vnd.github+json' \
          "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/supply-incremental.yml/dispatches" \
          -d "{\"ref\":\"${GITHUB_REF_NAME}\",\"inputs\":{\"chain\":\"0\"}}")
          if [ "$code" = '204' ]; then
            echo "증분 체인을 다시 열었다 (체인 0 부터)"
          else
            echo "::warning::증분 체인 재개 실패 HTTP ${code} — cron(7,37) 후퇴값에 맡긴다. 본문: $(head -c 300 /tmp/redispatch.out)"
          fi
